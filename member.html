<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentSync | Team Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D5D8C5; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#F4F5F0] text-stone-900 font-sans h-[100dvh] overflow-hidden">

    <div id="auth-view" class="absolute inset-0 bg-[#F4F5F0] z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-[#EAECE4] text-center">
            <i data-lucide="users" class="h-16 w-16 mx-auto text-[#8B4513] mb-4"></i>
            <h2 class="text-2xl font-black text-stone-800 mb-2">Team Portal</h2>
            <p class="text-sm text-stone-500 mb-6">Enter your ID or Name to access your tasks.</p>
            <form onsubmit="handleTeamLogin(event)">
                <input type="text" id="team-id" placeholder="e.g. Ali or 104442" class="w-full p-4 border rounded-xl bg-[#F9FAF8] mb-4 text-center font-bold text-lg" required>
                <button type="submit" class="w-full bg-[#8B4513] text-white p-4 rounded-xl font-bold hover:bg-[#A0522D]">Enter Space</button>
            </form>
        </div>
    </div>

    <div id="app-layout" class="hidden h-full flex flex-col md:flex-row max-w-7xl mx-auto p-4 md:p-8 gap-6">
        
        <div class="flex-1 flex flex-col gap-6 overflow-y-auto pb-20 md:pb-0">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl border shadow-sm">
                <div>
                    <h1 class="text-2xl font-black">Welcome, <span id="display-name" class="text-[#8B4513]"></span></h1>
                    <p class="text-stone-500 text-sm">Here are your pending items.</p>
                </div>
                <button onclick="logout()" class="text-red-500 text-sm font-bold bg-red-50 px-4 py-2 rounded-lg">Exit</button>
            </div>

            <div class="bg-rose-50 p-6 rounded-2xl border border-rose-100">
                <h2 class="font-bold flex items-center gap-2 text-rose-800 mb-4"><i data-lucide="megaphone" class="h-5 w-5"></i> Leader Announcements</h2>
                <div id="announcements-list" class="space-y-3"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl border shadow-sm flex-1">
                <h2 class="font-bold flex items-center gap-2 mb-4"><i data-lucide="check-square" class="h-5 w-5 text-[#556B2F]"></i> My Assigned Tasks</h2>
                <div id="tasks-list" class="space-y-3"></div>
            </div>
        </div>

        <div class="w-full md:w-96 bg-white border rounded-2xl shadow-sm flex flex-col h-[600px] md:h-full shrink-0">
            <div class="p-4 border-b bg-[#F9FAF8] rounded-t-2xl font-bold flex items-center gap-2">
                <i data-lucide="message-circle" class="text-[#4B5320]"></i> Team Chat
            </div>
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto bg-stone-50 flex flex-col gap-3"></div>
            <form onsubmit="sendMessage(event)" class="p-4 border-t flex gap-2">
                <input type="text" id="chat-input" placeholder="Ask a question..." class="flex-1 p-3 border rounded-xl" autocomplete="off">
                <button type="submit" class="bg-[#4B5320] text-white p-3 rounded-xl"><i data-lucide="send"></i></button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbxmPrqFkiYHeizx-b0AEOERF7WO_Rn9g",
            authDomain: "studentsync-a28b5.firebaseapp.com",
            projectId: "studentsync-a28b5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = localStorage.getItem('teamMemberId');

        if (currentUser) { loginUi(currentUser); }

        window.handleTeamLogin = (e) => {
            e.preventDefault();
            const id = document.getElementById('team-id').value.trim();
            if(id) {
                localStorage.setItem('teamMemberId', id);
                loginUi(id);
            }
        };

        window.logout = () => {
            localStorage.removeItem('teamMemberId');
            location.reload();
        };

        function loginUi(name) {
            currentUser = name;
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-layout').classList.remove('hidden');
            document.getElementById('display-name').innerText = name;
            setupListeners();
        }

        function setupListeners() {
            // Tasks (Filter roughly on client side for prototype)
            onSnapshot(collection(db, 'team_tasks'), snap => {
                const list = document.getElementById('tasks-list');
                const myTasks = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(t => t.assignee.toLowerCase() === currentUser.toLowerCase() || t.assignee === 'All');
                
                list.innerHTML = myTasks.map(t => `
                    <div class="p-4 border rounded-xl flex justify-between items-center ${t.status === 'Completed' ? 'bg-stone-100 opacity-60' : 'bg-white'}">
                        <span class="${t.status === 'Completed' ? 'line-through' : 'font-bold'}">${t.title}</span>
                        ${t.status !== 'Completed' ? `<button onclick="markDone('${t.id}')" class="bg-[#556B2F] text-white px-3 py-1 text-xs rounded-lg font-bold">Mark Done</button>` : `<span class="text-xs font-bold text-stone-500">Done</span>`}
                    </div>
                `).join('') || '<p class="text-sm text-stone-500 italic">No tasks assigned to you right now.</p>';
            });

            // Announcements
            onSnapshot(query(collection(db, 'announcements'), orderBy('createdAt', 'desc')), snap => {
                const list = document.getElementById('announcements-list');
                list.innerHTML = snap.docs.map(d => `<div class="p-3 bg-white border border-rose-200 rounded-lg text-sm text-rose-900 shadow-sm">${d.data().content}</div>`).join('') || '<p class="text-sm text-rose-600/60 italic">No announcements.</p>';
            });

            // Chat
            onSnapshot(query(collection(db, 'messages'), orderBy('createdAt', 'asc')), snap => {
                const box = document.getElementById('chat-box');
                box.innerHTML = snap.docs.map(d => {
                    const m = d.data();
                    const isMe = m.sender === currentUser;
                    return `
                    <div class="${isMe ? 'text-right' : 'text-left'}">
                        <span class="text-[9px] text-stone-400 font-bold uppercase">${m.sender}</span>
                        <div class="inline-block p-2.5 rounded-xl max-w-[85%] text-sm ${isMe ? 'bg-[#EAECE4] text-stone-800 rounded-br-none border' : (m.isAdmin ? 'bg-[#556B2F] text-white rounded-bl-none' : 'bg-white border rounded-bl-none')}">
                            ${m.text}
                        </div>
                    </div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
            });
        }

        window.markDone = async (id) => {
            await updateDoc(doc(db, 'team_tasks', id), { status: 'Completed' });
        };

        window.sendMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            await addDoc(collection(db, 'messages'), {
                sender: currentUser,
                text: input.value,
                isAdmin: false,
                createdAt: serverTimestamp()
            });
            input.value = '';
        };

        lucide.createIcons();
    </script>
</body>
</html>
