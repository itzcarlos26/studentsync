<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentSync | Team Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D5D8C5; border-radius: 10px; }
        .toast { background: #4B5320; color: white; padding: 12px 24px; border-radius: 8px; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold;}
        .toast.show { opacity: 1; }
    </style>
</head>
<body class="bg-[#F4F5F0] text-stone-900 font-sans h-[100dvh] overflow-hidden">

    <div id="app-layout" class="hidden h-full flex flex-col md:flex-row max-w-7xl mx-auto p-4 md:p-8 gap-6">
        
        <div class="flex-1 flex flex-col gap-6 overflow-y-auto pb-20 md:pb-0">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl border shadow-sm">
                <div>
                    <h1 class="text-2xl font-black">Welcome, <span id="display-name" class="text-[#8B4513]"></span></h1>
                    <p class="text-stone-500 text-sm">Submit and track your deliverables.</p>
                </div>
                <button onclick="logout()" class="text-red-500 text-sm font-bold bg-red-50 px-4 py-2 rounded-lg border border-red-100 hover:bg-red-100">Log Out</button>
            </div>

            <div class="bg-rose-50 p-6 rounded-2xl border border-rose-100">
                <h2 class="font-bold flex items-center gap-2 text-rose-800 mb-4"><i data-lucide="megaphone" class="h-5 w-5"></i> Leader Notices</h2>
                <div id="announcements-list" class="space-y-3"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl border shadow-sm flex-1">
                <h2 class="font-bold flex items-center gap-2 mb-4"><i data-lucide="upload-cloud" class="h-5 w-5 text-[#556B2F]"></i> Work Submission</h2>
                
                <form id="submission-form" onsubmit="submitWork(event)" class="bg-[#F9FAF8] p-4 rounded-xl border border-[#D5D8C5] mb-6 grid gap-3">
                    <input type="hidden" id="sub-id">
                    <input type="text" id="sub-title" placeholder="Task Title / Description" class="p-3 border rounded-lg w-full outline-none focus:border-[#556B2F]" required>
                    <input type="url" id="sub-link" placeholder="Paste Link (Google Drive, Docs, etc.)" class="p-3 border rounded-lg w-full outline-none focus:border-[#556B2F]" required>
                    <select id="sub-course" class="p-3 border rounded-lg w-full outline-none focus:border-[#556B2F]" required>
                        </select>
                    <button type="submit" id="sub-btn" class="bg-[#556B2F] text-white font-bold p-3 rounded-lg hover:bg-[#4B5320]">Submit Work</button>
                </form>

                <h3 class="font-bold text-stone-600 mb-3 text-sm uppercase">My Submissions</h3>
                <div id="submissions-list" class="space-y-3"></div>
            </div>
        </div>

        <div class="w-full md:w-96 bg-white border rounded-2xl shadow-sm flex flex-col h-[600px] md:h-full shrink-0">
            <div class="p-4 border-b bg-[#F9FAF8] rounded-t-2xl font-bold flex items-center gap-2">
                <i data-lucide="message-circle" class="text-[#4B5320]"></i> Team Chat
            </div>
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto bg-stone-50 flex flex-col gap-3"></div>
            <form onsubmit="sendMessage(event)" class="p-4 border-t flex gap-2">
                <input type="text" id="chat-input" placeholder="Say something..." class="flex-1 p-3 border rounded-xl outline-none focus:border-[#4B5320]" autocomplete="off">
                <button type="submit" class="bg-[#4B5320] text-white p-3 rounded-xl"><i data-lucide="send"></i></button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbxmPrqFkiYHeizx-b0AEOERF7WO_Rn9g",
            authDomain: "studentsync-a28b5.firebaseapp.com",
            projectId: "studentsync-a28b5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let memberData = JSON.parse(localStorage.getItem('syncMemberData'));
        let allCourses = [];

        window.showToast = (msg) => {
            const toast = document.getElementById('toast-container');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        // AUTHENTICATION CHECK
        if (!memberData) {
            window.location.href = 'index.html'; // Bounce back to gateway
        } else {
            document.getElementById('app-layout').classList.remove('hidden');
            document.getElementById('display-name').innerText = memberData.name;
            setupListeners();
        }

        window.logout = () => {
            localStorage.removeItem('syncMemberData');
            window.location.href = 'index.html';
        };

        const getCourseCode = (id) => allCourses.find(c => c.id === id)?.code || 'Unknown Course';

        function setupListeners() {
            // Get all courses to map names
            onSnapshot(collection(db, 'courses'), snap => {
                allCourses = snap.docs.map(d => ({id: d.id, ...d.data()}));
                
                // Populate course dropdown based ONLY on what Leader assigned this member
                const select = document.getElementById('sub-course');
                select.innerHTML = '<option value="" disabled selected>Select assigned course</option>' + 
                    memberData.courses.map(cId => `<option value="${cId}">${getCourseCode(cId)}</option>`).join('');
            });

            // Submissions List
            onSnapshot(query(collection(db, 'submissions'), orderBy('createdAt', 'desc')), snap => {
                const list = document.getElementById('submissions-list');
                const mySubs = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.memberId === memberData.memberId);
                
                list.innerHTML = mySubs.map(s => {
                    let statusUI = '';
                    let actionUI = '';

                    if (s.status === 'Pending') {
                        statusUI = '<span class="text-blue-700 bg-blue-100 px-2 py-0.5 rounded text-[10px] font-black uppercase">Pending</span>';
                        actionUI = `
                            <div class="mt-3 flex gap-2">
                                <button onclick="editWork('${s.id}', '${s.title.replace(/'/g, "\\'")}', '${s.link}', '${s.courseId}')" class="text-xs bg-white border border-stone-300 px-3 py-1.5 rounded font-bold hover:bg-stone-50 text-stone-700">Edit</button>
                                <button onclick="deleteWork('${s.id}')" class="text-xs bg-red-50 border border-red-200 px-3 py-1.5 rounded font-bold hover:bg-red-100 text-red-600">Delete</button>
                            </div>`;
                    } else if (s.status === 'Reviewing') {
                        statusUI = '<span class="text-orange-700 bg-orange-100 px-2 py-0.5 rounded text-[10px] font-black uppercase">Under Review</span>';
                        actionUI = '<p class="text-xs text-orange-600 font-bold mt-2"><i data-lucide="lock" class="inline w-3 h-3"></i> Locked by Leader</p>';
                    } else if (s.status === 'Approved') {
                        statusUI = '<span class="text-green-700 bg-green-100 px-2 py-0.5 rounded text-[10px] font-black uppercase">Approved</span>';
                    } else if (s.status === 'Rejected') {
                        statusUI = '<span class="text-red-700 bg-red-100 px-2 py-0.5 rounded text-[10px] font-black uppercase">Rejected</span>';
                        actionUI = `<button onclick="prepareResubmit('${s.title.replace(/'/g, "\\'")}', '${s.courseId}')" class="mt-2 w-full text-xs bg-red-600 text-white py-2 rounded-lg font-bold hover:bg-red-700">Upload New Revision</button>`;
                    }

                    const borderClass = s.status === 'Pending' ? 'border-blue-200 bg-blue-50' : 
                                        s.status === 'Reviewing' ? 'border-orange-200 bg-orange-50' : 
                                        s.status === 'Approved' ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50';

                    return `
                    <div class="p-4 border-2 rounded-xl ${borderClass}">
                        <div class="flex justify-between items-start mb-1">
                            <p class="font-bold text-stone-800">${s.title}</p>
                            ${statusUI}
                        </div>
                        <p class="text-xs text-stone-600 font-medium">${getCourseCode(s.courseId)}</p>
                        <a href="${s.link}" target="_blank" class="text-xs underline font-bold mt-2 inline-block text-stone-600">View Attachment</a>
                        ${actionUI}
                    </div>`;
                }).join('') || '<p class="text-sm text-stone-500 italic">You haven\'t submitted any work yet.</p>';
                lucide.createIcons();
            });

            // Announcements
            onSnapshot(query(collection(db, 'announcements'), orderBy('createdAt', 'desc')), snap => {
                const list = document.getElementById('announcements-list');
                list.innerHTML = snap.docs.map(d => `<div class="p-3 bg-white border border-rose-200 rounded-lg text-sm text-rose-900 shadow-sm">${d.data().content}</div>`).join('') || '<p class="text-sm text-rose-600/60 italic">No announcements.</p>';
            });

            // Chat
            onSnapshot(query(collection(db, 'messages'), orderBy('createdAt', 'asc')), snap => {
                const box = document.getElementById('chat-box');
                box.innerHTML = snap.docs.map(d => {
                    const m = d.data();
                    const isMe = m.sender === memberData.name;
                    return `
                    <div class="${isMe ? 'text-right' : 'text-left'}">
                        <span class="text-[9px] text-stone-400 font-bold uppercase">${m.sender}</span>
                        <div class="inline-block p-2.5 rounded-xl max-w-[85%] text-sm ${isMe ? 'bg-[#EAECE4] text-stone-800 rounded-br-none border' : (m.isAdmin ? 'bg-[#556B2F] text-white rounded-bl-none' : 'bg-white border rounded-bl-none')}">
                            ${m.text}
                        </div>
                    </div>`;
                }).join('');
                box.scrollTop = box.scrollHeight;
            });
        }

        // --- SUBMISSION ACTIONS ---
        window.submitWork = async (e) => {
            e.preventDefault();
            const idField = document.getElementById('sub-id').value;
            const title = document.getElementById('sub-title').value;
            const link = document.getElementById('sub-link').value;
            const courseId = document.getElementById('sub-course').value;

            if (idField) {
                // Editing an existing pending submission
                await updateDoc(doc(db, 'submissions', idField), { title, link, courseId });
                showToast("Submission Updated");
                document.getElementById('sub-btn').innerText = "Submit Work";
            } else {
                // Adding a new submission
                await addDoc(collection(db, 'submissions'), {
                    memberId: memberData.memberId,
                    memberName: memberData.name,
                    title: title,
                    link: link,
                    courseId: courseId,
                    status: 'Pending', // All new submissions start Pending
                    createdAt: Date.now()
                });
                showToast("Work Submitted");
            }
            e.target.reset();
            document.getElementById('sub-id').value = '';
        };

        window.editWork = (id, title, link, courseId) => {
            document.getElementById('sub-id').value = id;
            document.getElementById('sub-title').value = title;
            document.getElementById('sub-link').value = link;
            document.getElementById('sub-course').value = courseId;
            document.getElementById('sub-btn').innerText = "Save Changes";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteWork = async (id) => {
            if(confirm("Delete this submission?")) {
                await deleteDoc(doc(db, 'submissions', id));
                showToast("Deleted");
            }
        };

        window.prepareResubmit = (oldTitle, courseId) => {
            document.getElementById('sub-id').value = ''; // Ensure it creates a NEW doc
            document.getElementById('sub-title').value = oldTitle + " (Resubmission)";
            document.getElementById('sub-link').value = '';
            document.getElementById('sub-course').value = courseId;
            document.getElementById('sub-link').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast("Ready to reupload. Paste new link.");
        };

        window.sendMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            await addDoc(collection(db, 'messages'), { sender: memberData.name, text: input.value, isAdmin: false, createdAt: serverTimestamp() });
            input.value = '';
        };

        lucide.createIcons();
    </script>
</body>
</html>
