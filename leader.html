<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentSync | Leader Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D5D8C5; border-radius: 10px; }
        .toast { background: #4B5320; color: white; padding: 12px 24px; border-radius: 8px; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body class="bg-[#F4F5F0] text-stone-900 font-sans h-[100dvh] overflow-hidden flex">

    <div id="auth-view" class="absolute inset-0 bg-[#F4F5F0] z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-[#EAECE4]">
            <h2 class="text-2xl font-black text-center text-stone-800 mb-2">StudentSync Leader Login</h2>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4 mt-6">
                <div>
                    <label class="block text-xs font-bold text-stone-500 uppercase mb-1">Username (ID)</label>
                    <input type="text" id="admin-user" class="w-full p-3 border rounded-xl bg-[#F9FAF8]" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-500 uppercase mb-1">Password</label>
                    <input type="password" id="admin-pass" class="w-full p-3 border rounded-xl bg-[#F9FAF8]" required>
                </div>
                <button type="submit" class="w-full bg-[#4B5320] text-white p-4 rounded-xl font-bold hover:bg-[#556B2F]">Access Dashboard</button>
            </form>
        </div>
    </div>

    <div id="app-layout" class="hidden h-full w-full flex">
        
        <nav class="w-64 bg-[#EAECE4] border-r flex flex-col z-50">
            <div class="bg-[#4B5320] text-white p-6 font-bold text-2xl flex items-center gap-3">
                <i data-lucide="shield" class="h-8 w-8 text-[#DCD7A0]"></i>
                <span>Leader</span>
            </div>
            <div class="flex flex-col p-4 gap-2 flex-1 overflow-y-auto" id="nav-container">
                </div>
        </nav>

        <main class="flex-1 overflow-y-auto p-8 relative" id="app-content">
            <div class="max-w-5xl mx-auto h-full" id="main-view"></div>
        </main>
    </div>

    <div id="toast-container" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbxmPrqFkiYHeizx-b0AEOERF7WO_Rn9g",
            authDomain: "studentsync-a28b5.firebaseapp.com",
            projectId: "studentsync-a28b5",
            storageBucket: "studentsync-a28b5.firebasestorage.app",
            messagingSenderId: "790725463704",
            appId: "1:790725463704:web:9db73998331b6ee2dd0aed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.state = {
            activeTab: 'tasks',
            tasks: [],
            announcements: [],
            messages: []
        };

        window.showToast = (msg) => {
            const toast = document.getElementById('toast-container');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        window.handleAdminLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            if (u === '103573' && p === 'Carlos@103573') {
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('app-layout').classList.remove('hidden');
                setupListeners();
                renderApp();
            } else {
                alert("Invalid Credentials");
            }
        };

        function setupListeners() {
            onSnapshot(collection(db, 'team_tasks'), snap => {
                window.state.tasks = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(window.state.activeTab === 'tasks') renderApp();
            });
            onSnapshot(query(collection(db, 'announcements'), orderBy('createdAt', 'desc')), snap => {
                window.state.announcements = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(window.state.activeTab === 'announcements') renderApp();
            });
            onSnapshot(query(collection(db, 'messages'), orderBy('createdAt', 'asc')), snap => {
                window.state.messages = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(window.state.activeTab === 'chat') { renderApp(); scrollToBottom(); }
            });
        }

        window.switchTab = (tab) => { window.state.activeTab = tab; renderApp(); };

        window.addTask = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, 'team_tasks'), {
                title: document.getElementById('task-title').value,
                assignee: document.getElementById('task-assignee').value,
                status: 'Pending',
                createdAt: serverTimestamp()
            });
            showToast("Task Assigned!");
            e.target.reset();
        };

        window.addAnnouncement = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, 'announcements'), {
                content: document.getElementById('ann-content').value,
                createdAt: serverTimestamp()
            });
            showToast("Announcement Posted!");
            e.target.reset();
        };

        window.sendMessage = async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if(!input.value.trim()) return;
            await addDoc(collection(db, 'messages'), {
                sender: 'Leader (Carlos)',
                text: input.value,
                isAdmin: true,
                createdAt: serverTimestamp()
            });
            input.value = '';
        };

        window.deleteItem = async (col, id) => {
            await deleteDoc(doc(db, col, id));
            showToast("Deleted.");
        };

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-box');
            if(chatBox) chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderApp() {
            const nav = [
                { id: 'tasks', icon: 'check-square', label: 'Manage Tasks' },
                { id: 'announcements', icon: 'megaphone', label: 'Announcements' },
                { id: 'chat', icon: 'message-circle', label: 'Team Chat' }
            ];

            document.getElementById('nav-container').innerHTML = nav.map(n => `
                <button onclick="switchTab('${n.id}')" class="flex items-center gap-3 p-3 rounded-xl transition-all ${window.state.activeTab === n.id ? 'bg-[#556B2F] text-white' : 'text-stone-600 hover:bg-[#D5D8C5]'}">
                    <i data-lucide="${n.icon}" class="h-5 w-5"></i> ${n.label}
                </button>
            `).join('');

            const main = document.getElementById('main-view');
            
            if (window.state.activeTab === 'tasks') {
                const list = window.state.tasks.map(t => `
                    <div class="p-4 bg-white border rounded-xl flex justify-between items-center mb-3">
                        <div><p class="font-bold">${t.title}</p><p class="text-sm text-stone-500">Assigned to: ${t.assignee} | Status: <span class="${t.status === 'Completed' ? 'text-green-600' : 'text-orange-600'}">${t.status}</span></p></div>
                        <button onclick="deleteItem('team_tasks', '${t.id}')" class="text-red-500 hover:bg-red-50 p-2 rounded"><i data-lucide="trash-2"></i></button>
                    </div>
                `).join('') || '<p>No tasks assigned.</p>';

                main.innerHTML = `
                    <h1 class="text-3xl font-bold mb-6">Assign Tasks</h1>
                    <form onsubmit="addTask(event)" class="bg-white p-5 rounded-xl border mb-8 flex gap-4">
                        <input type="text" id="task-title" placeholder="Task Description" class="flex-1 p-3 border rounded-lg bg-stone-50" required>
                        <input type="text" id="task-assignee" placeholder="Team Member ID/Name" class="w-48 p-3 border rounded-lg bg-stone-50" required>
                        <button type="submit" class="bg-[#4B5320] text-white px-6 rounded-lg font-bold">Assign</button>
                    </form>
                    <div>${list}</div>
                `;
            } else if (window.state.activeTab === 'announcements') {
                const list = window.state.announcements.map(a => `
                    <div class="p-4 bg-white border rounded-xl mb-3 flex justify-between">
                        <p>${a.content}</p>
                        <button onclick="deleteItem('announcements', '${a.id}')" class="text-red-500"><i data-lucide="trash-2"></i></button>
                    </div>
                `).join('') || '<p>No announcements yet.</p>';

                main.innerHTML = `
                    <h1 class="text-3xl font-bold mb-6">Broadcast Announcement</h1>
                    <form onsubmit="addAnnouncement(event)" class="mb-8">
                        <textarea id="ann-content" placeholder="Type your announcement here..." class="w-full p-4 border rounded-xl bg-white min-h-[100px] mb-3" required></textarea>
                        <button type="submit" class="bg-[#8B4513] text-white px-6 py-3 rounded-lg font-bold">Post to Team</button>
                    </form>
                    <div>${list}</div>
                `;
            } else if (window.state.activeTab === 'chat') {
                const list = window.state.messages.map(m => `
                    <div class="mb-4 ${m.isAdmin ? 'text-right' : 'text-left'}">
                        <span class="text-[10px] text-stone-500 font-bold uppercase">${m.sender}</span>
                        <div class="inline-block p-3 rounded-xl max-w-[70%] ${m.isAdmin ? 'bg-[#556B2F] text-white rounded-br-none' : 'bg-white border rounded-bl-none'}">
                            ${m.text}
                        </div>
                    </div>
                `).join('');

                main.innerHTML = `
                    <h1 class="text-3xl font-bold mb-6">Team Chat</h1>
                    <div class="flex flex-col h-[600px] bg-stone-50 rounded-xl border">
                        <div id="chat-box" class="flex-1 p-4 overflow-y-auto">${list}</div>
                        <form onsubmit="sendMessage(event)" class="p-4 bg-white border-t flex gap-2 rounded-b-xl">
                            <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 p-3 border rounded-lg" autocomplete="off">
                            <button type="submit" class="bg-[#4B5320] text-white px-6 rounded-lg font-bold">Send</button>
                        </form>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        lucide.createIcons();
    </script>
</body>
</html>
