<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentSync | Leader Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D5D8C5; border-radius: 10px; }
        .toast { background: #4B5320; color: white; padding: 12px 24px; border-radius: 8px; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-weight: bold; }
        .toast.show { opacity: 1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-[#F4F5F0] text-stone-900 font-sans h-[100dvh] overflow-hidden flex flex-col md:flex-row">

    <div id="app-layout" class="hidden h-full w-full flex-col md:flex-row relative">
        <div class="md:hidden bg-[#4B5320] text-white p-4 font-bold text-xl flex items-center justify-between shadow-md z-20 shrink-0">
            <span>StudentSync Leader</span>
            <i data-lucide="shield" class="h-6 w-6 text-[#DCD7A0]"></i>
        </div>

        <nav class="fixed md:relative bottom-0 left-0 w-full md:w-64 bg-[#EAECE4] border-t md:border-t-0 md:border-r z-50 flex flex-col shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-none">
            <div class="hidden md:flex bg-[#4B5320] text-white p-6 font-bold text-2xl items-center gap-3 shrink-0">
                <i data-lucide="shield" class="h-8 w-8 text-[#DCD7A0]"></i>
                <span>Leader</span>
            </div>
            <div class="flex md:flex-col p-2 md:p-4 gap-2 overflow-x-auto md:overflow-y-auto no-scrollbar shrink-0 h-16 md:h-full" id="nav-container"></div>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 relative flex flex-col" id="app-content">
            <div class="max-w-6xl mx-auto w-full flex-1" id="main-view"></div>
            <footer class="mt-8 text-center text-xs font-bold text-stone-400 w-full">
                &copy; 2026 Carlos Darrel. All rights reserved.
            </footer>
        </main>
    </div>

    <div id="toast-container" class="toast"></div>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
        
        const supabaseUrl = 'https://aeszyfpgmggpfxjwertc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlc3p5ZnBnbWdncGZ4andlcnRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTYxODAsImV4cCI6MjA5MTAzMjE4MH0.WA22hdQiad4ZMlVgllEfKh6V9DdEdJRNTlb6J1PcoGM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        window.state = { activeTab: 'dashboard', activeChatCourse: 'Global', courses: [], myTasks: [], exams: [], studySessions: [], teamMembers: [], submissions: [], announcements: [], messages: [] };
        window.timerState = { mode: 'stopwatch', isActive: false, timeSeconds: 0, isBreak: false, inputMinutes: 60, courseId: '', intervalRef: null };

        window.showToast = (msg) => { const toast = document.getElementById('toast-container'); toast.innerText = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); };
        const getCourseCode = (id) => window.state.courses.find(c => c.id === id)?.code || (id === 'Global' ? 'Global Broadcast' : 'Unknown');

        if (localStorage.getItem('syncRole') !== 'leader') { window.location.href = 'index.html'; } 
        else { document.getElementById('app-layout').classList.remove('hidden'); document.getElementById('app-layout').classList.add('flex'); fetchAllData(); }

        window.logout = () => { localStorage.removeItem('syncRole'); window.location.href = 'index.html'; };

        async function fetchAllData() {
            const [c, t, e, s, tm, sub, a, m] = await Promise.all([
                supabase.from('courses').select('*').order('created_at', { ascending: false }),
                supabase.from('tasks').select('*').order('created_at', { ascending: false }),
                supabase.from('exams').select('*').order('created_at', { ascending: false }),
                supabase.from('study_sessions').select('*').order('timestamp', { ascending: false }),
                supabase.from('team_members').select('*').order('created_at', { ascending: false }),
                supabase.from('submissions').select('*').order('updated_at', { ascending: false }),
                supabase.from('announcements').select('*').order('created_at', { ascending: false }),
                supabase.from('messages').select('*').order('created_at', { ascending: true })
            ]);
            
            window.state.courses = c.data || []; window.state.myTasks = t.data || []; window.state.exams = e.data || [];
            window.state.studySessions = s.data || []; window.state.teamMembers = tm.data || []; window.state.submissions = sub.data || [];
            window.state.announcements = a.data || []; window.state.messages = m.data || [];
            
            renderApp(); if(window.state.activeTab === 'chat') scrollToBottom();
        }

        setInterval(async () => {
            if (window.state.activeTab === 'chat') {
                const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true });
                if (data && JSON.stringify(data) !== JSON.stringify(window.state.messages)) { window.state.messages = data; renderChatMessages(); }
            } else if (window.state.activeTab === 'dashboard') {
                const { data } = await supabase.from('team_members').select('*').order('created_at', { ascending: false });
                if (data) { window.state.teamMembers = data; renderApp(); }
            }
        }, 5000);

        window.switchTab = (tab) => { if(tab === 'logout') { window.logout(); return; } window.state.activeTab = tab; renderApp(); if(tab === 'chat') scrollToBottom(); };
        window.switchChatCourse = (courseId) => { window.state.activeChatCourse = courseId; renderChatMessages(); };
        window.deleteItem = async (col, id) => { if(confirm("Delete this item?")) { await supabase.from(col).delete().eq('id', id); showToast("Deleted."); fetchAllData(); } };
        window.toggleMyTask = async (id) => { const task = window.state.myTasks.find(t => t.id === id); await supabase.from('tasks').update({ completed: !task.completed, completed_at: !task.completed ? Date.now() : null }).eq('id', id); fetchAllData(); };
        window.addCourse = async (e) => { e.preventDefault(); await supabase.from('courses').insert([{ code: document.getElementById('c-code').value.toUpperCase(), name: document.getElementById('c-name').value, created_at: Date.now() }]); showToast("Course Added"); e.target.reset(); fetchAllData(); };
        window.addExam = async (e) => { e.preventDefault(); await supabase.from('exams').insert([{ course_id: document.getElementById('e-course').value, type: document.getElementById('e-type').value, date: document.getElementById('e-date').value, created_at: Date.now() }]); showToast("Exam Scheduled"); e.target.reset(); fetchAllData(); };
        
        window.editMyTask = (id, title, courseId, dueDate) => {
            document.getElementById('t-id').value = id; document.getElementById('t-title').value = title; document.getElementById('t-course').value = courseId; document.getElementById('t-date').value = dueDate;
            document.getElementById('t-form-title').innerText = "Edit Task Details"; document.getElementById('t-submit-btn').innerText = "Save Changes"; document.getElementById('t-cancel-btn').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        window.cancelEditTask = () => { const form = document.getElementById('t-form'); if(form) form.reset(); document.getElementById('t-id').value = ''; document.getElementById('t-form-title').innerText = "Add New Task"; document.getElementById('t-submit-btn').innerText = "Add Task"; document.getElementById('t-cancel-btn').classList.add('hidden'); };
        window.addMyTask = async (e) => {
            e.preventDefault(); const id = document.getElementById('t-id').value; const title = document.getElementById('t-title').value; const course_id = document.getElementById('t-course').value; const due_date = document.getElementById('t-date').value;
            if (id) { await supabase.from('tasks').update({ title, course_id, due_date }).eq('id', id); showToast("Task Updated"); } 
            else { await supabase.from('tasks').insert([{ title, course_id, due_date, completed: false, created_at: Date.now() }]); showToast("Personal Task Added"); }
            window.cancelEditTask(); fetchAllData();
        };

        window.editTeamMember = (docId, memberId, name, coursesStr) => {
            document.getElementById('tm-doc-id').value = docId; document.getElementById('tm-id').value = memberId; document.getElementById('tm-name').value = name;
            const courseArr = coursesStr ? coursesStr.split(',') : []; document.querySelectorAll('input[name="tm-courses"]').forEach(cb => cb.checked = courseArr.includes(cb.value));
            document.getElementById('tm-form-title').innerText = "Edit Member Details"; document.getElementById('tm-submit-btn').innerText = "Save Changes"; document.getElementById('tm-cancel-btn').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        window.cancelEditTm = () => { const form = document.getElementById('tm-form'); if(form) form.reset(); document.getElementById('tm-doc-id').value = ''; document.getElementById('tm-form-title').innerText = "Register New Member"; document.getElementById('tm-submit-btn').innerText = "Register Member"; document.getElementById('tm-cancel-btn').classList.add('hidden'); };
        window.addTeamMember = async (e) => {
            e.preventDefault(); const docId = document.getElementById('tm-doc-id').value; const memberId = document.getElementById('tm-id').value; const name = document.getElementById('tm-name').value; const courses = Array.from(document.querySelectorAll('input[name="tm-courses"]:checked')).map(cb => cb.value);
            if (docId) { await supabase.from('team_members').update({ member_id: memberId, name: name, courses: courses }).eq('id', docId); showToast("Member Updated"); } else { await supabase.from('team_members').insert([{ member_id: memberId, name: name, courses: courses, created_at: Date.now() }]); showToast("Member Registered"); }
            window.cancelEditTm(); fetchAllData();
        };

        // --- NEW: Handle Feedback on Rejection ---
        window.updateSubStatus = async (id, status) => { 
            let feedback = null;
            if (status === 'Rejected') {
                feedback = prompt("Please provide a reason for rejecting this submission:");
                if (feedback === null) return; // User clicked Cancel
            }

            const updateData = { status: status };
            if (status === 'Rejected') {
                updateData.feedback = feedback;
            } else {
                updateData.feedback = null; // Clear feedback if changed to something else
            }

            await supabase.from('submissions').update(updateData).eq('id', id); 
            showToast(`Status updated to ${status}`); 
            fetchAllData(); 
        };

        window.addAnnouncement = async (e) => { e.preventDefault(); await supabase.from('announcements').insert([{ content: document.getElementById('ann-content').value }]); showToast("Announcement Posted!"); e.target.reset(); fetchAllData(); };

        window.sendMessage = async (e) => {
            e.preventDefault(); const input = document.getElementById('chat-input'); if(!input.value.trim()) return;
            document.getElementById('typing-indicator').classList.remove('hidden');
            setTimeout(async () => { await supabase.from('messages').insert([{ sender: 'Leader', text: input.value, is_admin: true, course_id: window.state.activeChatCourse }]); input.value = ''; document.getElementById('typing-indicator').classList.add('hidden'); fetchAllData(); }, 400);
        };
        window.clearChat = async () => { if(confirm("Clear messages in this specific course?")) { await supabase.from('messages').delete().eq('course_id', window.state.activeChatCourse); showToast("Chat Cleared"); fetchAllData(); } };

        function scrollToBottom() { const chatBox = document.getElementById('chat-box'); if(chatBox) chatBox.scrollTop = chatBox.scrollHeight; }

        function renderChatMessages() {
            const box = document.getElementById('chat-box'); if(!box) return;
            const filteredMessages = window.state.messages.filter(m => m.course_id === window.state.activeChatCourse);
            box.innerHTML = filteredMessages.map(m => {
                const timeStr = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); const isReadByTeam = m.read_by && m.read_by.length > 0;
                return `<div class="flex flex-col ${m.is_admin ? 'items-end' : 'items-start'} mb-4 group relative">${!m.is_admin ? `<span class="text-[10px] text-stone-500 font-bold mb-1 ml-1">${m.sender}</span>` : ''}<div class="relative max-w-[75%] px-4 py-2.5 text-sm rounded-2xl shadow-sm ${m.is_admin ? 'bg-[#556B2F] text-white rounded-br-sm' : 'bg-white border border-[#EAECE4] text-stone-800 rounded-bl-sm'}"><p class="leading-relaxed pr-2">${m.text}</p><div class="flex items-center justify-end gap-1.5 mt-1 -mb-1"><span class="text-[9px] font-medium ${m.is_admin ? 'text-white/70' : 'text-stone-400'}">${timeStr}</span>${m.is_admin ? `<i data-lucide="check-check" class="w-3.5 h-3.5 ${isReadByTeam ? 'text-[#a3d8f4]' : 'text-white/50'}"></i>` : ''}</div></div><button onclick="deleteItem('messages', '${m.id}')" class="absolute top-2 ${m.is_admin ? '-left-8' : '-right-8'} opacity-0 group-hover:opacity-100 p-1 text-red-500 transition-opacity bg-white rounded-full shadow-sm border border-red-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`;
            }).join('') || '<div class="flex-1 flex items-center justify-center text-stone-400 text-sm font-medium">No messages in this course yet.</div>';
            lucide.createIcons(); scrollToBottom();
        }

        const formatTime = (totalSeconds) => { const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0'); const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0'); const s = (totalSeconds % 60).toString().padStart(2, '0'); return window.timerState.mode === 'stopwatch' ? `${h}:${m}:${s}` : `${m}:${s}`; };
        window.setTimerMode = (mode) => { window.timerState.mode = mode; window.resetTimer(); };
        window.toggleTimer = () => { const ts = window.timerState; if(!ts.isActive && ts.timeSeconds === 0) { if(ts.mode === 'pomodoro') ts.timeSeconds = ts.isBreak ? 5*60 : 25*60; else if(ts.mode === 'countdown') ts.timeSeconds = ts.inputMinutes * 60; } ts.isActive = !ts.isActive; if(ts.isActive) { ts.intervalRef = setInterval(() => { if (ts.mode === 'stopwatch') ts.timeSeconds++; else { if (ts.timeSeconds <= 1) { clearInterval(ts.intervalRef); ts.isActive = false; ts.timeSeconds = 0; showToast("Time's Up!"); } else ts.timeSeconds--; } const display = document.getElementById('timer-display-time'); if(display) display.innerText = formatTime(ts.timeSeconds); }, 1000); } else { clearInterval(ts.intervalRef); } renderApp(); };
        window.resetTimer = () => { clearInterval(window.timerState.intervalRef); window.timerState.isActive = false; window.timerState.timeSeconds = 0; renderApp(); };
        window.finishSession = async () => { const ts = window.timerState; let durationSaved = ts.mode === 'stopwatch' ? ts.timeSeconds : (ts.mode === 'pomodoro' ? (ts.isBreak ? 5*60 : 25*60) - ts.timeSeconds : (ts.inputMinutes * 60) - ts.timeSeconds); if (durationSaved < 5) { showToast("Session too short."); window.resetTimer(); return; } ts.isActive = false; clearInterval(ts.intervalRef); await supabase.from('study_sessions').insert([{ course_id: ts.courseId || 'General', duration: durationSaved, timestamp: Date.now(), mode: ts.mode }]); window.resetTimer(); showToast("Session Saved!"); fetchAllData(); };

        function renderApp() {
            const nav = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' }, { id: 'courses', icon: 'library', label: 'Courses' }, { id: 'myTasks', icon: 'check-circle-2', label: 'My Tasks' },
                { id: 'divider', type: 'divider' }, { id: 'teamMgmt', icon: 'users', label: 'Team Mgmt' }, { id: 'submissions', icon: 'inbox', label: 'Submissions' }, { id: 'announcements', icon: 'megaphone', label: 'Notices' }, { id: 'chat', icon: 'message-circle', label: 'Messenger' },
                { id: 'divider2', type: 'divider' }, { id: 'exams', icon: 'calendar', label: 'Exams' }, { id: 'timer', icon: 'clock', label: 'Timer' }, { id: 'history', icon: 'history', label: 'History' }, { id: 'logout', icon: 'log-out', label: 'Logout', extraClass: 'text-red-600 hover:bg-red-50' }
            ];

            document.getElementById('nav-container').innerHTML = nav.map(n => { if(n.type === 'divider') return `<div class="hidden md:block my-2 border-t border-[#D5D8C5] shrink-0"></div>`; return `<button onclick="switchTab('${n.id}')" class="flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:p-3 rounded-xl transition-all flex-shrink-0 justify-center md:justify-start min-w-[64px] ${window.state.activeTab === n.id ? 'bg-[#556B2F] text-white font-semibold' : (n.extraClass || 'text-stone-600 hover:bg-[#D5D8C5]')}"><i data-lucide="${n.icon}" class="h-5 w-5 md:h-5 md:w-5"></i> <span class="text-[10px] md:text-sm">${n.label}</span></button>`; }).join('');

            const main = document.getElementById('main-view');
            
            if (window.state.activeTab === 'dashboard') {
                const pendingTasks = window.state.myTasks.filter(t => !t.completed);
                const reviewNeeded = window.state.submissions.filter(s => s.status === 'Pending').length;
                const examsList = window.state.exams.slice().sort((a, b) => new Date(a.date) - new Date(b.date));
                const now = Date.now();
                
                const getUrgencyStyles = (dateString) => {
                    const days = (new Date(dateString).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000 * 60 * 60 * 24);
                    if (days < 7) return 'bg-red-50 border-red-200 border-l-4 border-l-red-500 text-red-900';
                    if (days <= 21) return 'bg-orange-50 border-orange-200 border-l-4 border-l-orange-500 text-orange-900';
                    return 'bg-stone-50 border-stone-200 border-l-4 border-l-stone-400 text-stone-800';
                };

                const msgCounts = window.state.messages.reduce((acc, m) => { acc[m.course_id] = (acc[m.course_id]||0)+1; return acc; }, {});
                const msgHtml = Object.entries(msgCounts).map(([cId, count]) => `<div class="flex justify-between items-center text-[11px] font-bold border-b border-stone-100 last:border-0 py-1.5"><span class="truncate pr-2">${getCourseCode(cId)}</span><span class="text-[#4B5320] bg-[#EAECE4] px-1.5 py-0.5 rounded">${count}</span></div>`).join('') || '<div class="text-xs text-stone-400 mt-2">No messages</div>';

                const tListHtml = pendingTasks.sort((a,b) => new Date(a.due_date) - new Date(b.due_date)).slice(0, 5).map(t => `
                    <div class="flex items-start gap-3 p-3 rounded-xl shadow-sm hover:shadow-md transition-all mb-3 ${getUrgencyStyles(t.due_date)}">
                        <button onclick="toggleMyTask('${t.id}')" class="mt-0.5 h-5 w-5 rounded-full border-2 border-current opacity-40 flex-shrink-0 flex items-center justify-center hover:opacity-100 hover:bg-current text-transparent hover:text-white transition-colors"><i data-lucide="check-circle-2" class="h-3 w-3"></i></button>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start gap-2"><span class="font-bold text-current truncate">${t.title}</span><span class="text-[10px] font-black px-1.5 py-0.5 bg-white/60 rounded shadow-sm border border-black/5 whitespace-nowrap text-stone-700">${new Date(t.due_date).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span></div>
                            <span class="text-xs text-current opacity-80 mt-1 font-medium">${getCourseCode(t.course_id)}</span>
                        </div>
                    </div>
                `).join('') || `<p class="text-sm text-stone-500 italic">No pending tasks.</p>`;

                const eListHtml = examsList.slice(0, 5).map(e => `
                    <div class="flex flex-col p-3 rounded-xl shadow-sm bg-white border border-[#EAECE4] mb-3 border-l-4 border-l-rose-500">
                        <div class="flex justify-between items-start"><span class="font-black text-stone-800">${getCourseCode(e.course_id)}</span><span class="text-[10px] font-black px-1.5 py-0.5 bg-rose-50 rounded shadow-sm border border-rose-100 whitespace-nowrap text-rose-700">${new Date(e.date).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span></div>
                        <span class="text-xs text-stone-600 mt-1 font-medium uppercase tracking-wider">${e.type}</span>
                    </div>
                `).join('') || `<p class="text-sm text-stone-500 italic">No upcoming exams.</p>`;

                const sortedTeamMembers = [...window.state.teamMembers].sort((a, b) => {
                    const lastA = a.last_active || 0;
                    const lastB = b.last_active || 0;
                    return lastB - lastA; 
                });

                const teamStatusHtml = sortedTeamMembers.map(m => {
                    const lastActive = m.last_active;
                    let statusUi = ''; let timeText = 'Never seen';
                    
                    if (lastActive) {
                        const diffMins = Math.floor((now - lastActive) / 60000);
                        if (diffMins <= 3) {
                            statusUi = '<div class="w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse shadow-[0_0_5px_rgba(34,197,94,0.6)]"></div>';
                            timeText = '<span class="text-green-600">Online now</span>';
                        } else if (diffMins < 60) {
                            statusUi = '<div class="w-2.5 h-2.5 rounded-full bg-stone-300"></div>';
                            timeText = `${diffMins}m ago`;
                        } else if (diffMins < 1440) {
                            statusUi = '<div class="w-2.5 h-2.5 rounded-full bg-stone-300"></div>';
                            timeText = `${Math.floor(diffMins/60)}h ago`;
                        } else {
                            statusUi = '<div class="w-2.5 h-2.5 rounded-full bg-stone-300"></div>';
                            timeText = `${Math.floor(diffMins/1440)}d ago`;
                        }
                    } else { statusUi = '<div class="w-2.5 h-2.5 rounded-full bg-stone-200"></div>'; }

                    return `
                    <div class="flex items-center justify-between p-2.5 border-b border-stone-50 last:border-0 hover:bg-stone-50 transition-colors">
                        <div class="flex items-center gap-3">${statusUi}<span class="font-bold text-sm text-stone-700">${m.name}</span></div>
                        <span class="text-[10px] font-bold text-stone-400 uppercase tracking-wider">${timeText}</span>
                    </div>`;
                }).join('') || `<p class="text-sm text-stone-500 italic p-2">No team members registered.</p>`;

                main.innerHTML = `
                    <h1 class="text-3xl font-bold text-stone-800 mb-6">Overview</h1>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border"><p class="text-xs text-stone-500 font-bold uppercase">My Tasks</p><p class="text-2xl font-black">${pendingTasks.length}</p></div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-blue-200"><p class="text-xs text-blue-600 font-bold uppercase">New Subs</p><p class="text-2xl font-black text-blue-700">${reviewNeeded}</p></div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border"><p class="text-xs text-stone-500 font-bold uppercase">Team Size</p><p class="text-2xl font-black">${window.state.teamMembers.length}</p></div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border"><p class="text-xs text-stone-500 font-bold uppercase">Exams</p><p class="text-2xl font-black">${window.state.exams.length}</p></div>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border col-span-2 md:col-span-1 flex flex-col max-h-[88px] overflow-hidden"><p class="text-[10px] text-stone-500 font-bold uppercase mb-1">Messages</p><div class="overflow-y-auto no-scrollbar flex-1 pr-1">${msgHtml}</div></div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col">
                            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-stone-800 border-b border-[#F4F5F0] pb-2"><i data-lucide="check-circle-2" class="h-5 w-5 text-[#556B2F]"></i>My Tasks Timeline</h2>
                            <div class="flex gap-2 mb-4 text-[8px] font-bold uppercase tracking-wider"><span class="text-red-700 bg-red-100 px-1.5 py-1 rounded">< 7 Days</span><span class="text-orange-700 bg-orange-100 px-1.5 py-1 rounded">7-21 Days</span><span class="text-stone-600 bg-stone-200 px-1.5 py-1 rounded">> 21 Days</span></div>
                            <div class="flex-1">${tListHtml}</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col">
                            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-stone-800 border-b border-[#F4F5F0] pb-2"><i data-lucide="calendar" class="h-5 w-5 text-rose-600"></i>Upcoming Exams</h2>
                            <div class="flex-1 mt-1">${eListHtml}</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col h-[400px]">
                            <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-stone-800 border-b border-[#F4F5F0] pb-2"><i data-lucide="activity" class="h-5 w-5 text-blue-500"></i>Team Activity</h2>
                            <div class="flex-1 overflow-y-auto no-scrollbar">${teamStatusHtml}</div>
                        </div>
                    </div>
                `;
            } else if (window.state.activeTab === 'chat') {
                const courseOptions = window.state.courses.map(c => `<option value="${c.id}" ${window.state.activeChatCourse === c.id ? 'selected' : ''}>${c.code} Chat</option>`).join('');
                main.innerHTML = `<div class="flex justify-between items-center mb-6"><h1 class="text-3xl font-bold flex items-center gap-2"><i data-lucide="message-square" class="text-[#556B2F]"></i> Workspace Messenger</h1></div><div class="flex flex-col h-[600px] bg-[#EAECE4] rounded-2xl border shadow-sm overflow-hidden relative"><div class="bg-white p-4 border-b flex justify-between items-center z-10 shadow-sm"><div class="flex items-center gap-3"><div class="bg-[#F4F5F0] p-2 rounded-full"><i data-lucide="hash" class="text-[#4B5320] w-5 h-5"></i></div><select onchange="switchChatCourse(this.value)" class="text-lg font-bold text-stone-800 bg-transparent outline-none cursor-pointer hover:bg-stone-50 rounded-lg p-1 transition-colors"><option value="Global" ${window.state.activeChatCourse === 'Global' ? 'selected' : ''}>Global Broadcast</option>${courseOptions}</select></div><button onclick="clearChat()" class="text-stone-400 hover:text-red-600 transition-colors p-2 rounded-full hover:bg-red-50" title="Clear this chat"><i data-lucide="trash-2" class="w-5 h-5"></i></button></div><div id="chat-box" class="flex-1 p-6 overflow-y-auto flex flex-col scroll-smooth"></div><div id="typing-indicator" class="hidden absolute bottom-24 left-6 bg-white px-4 py-2 rounded-2xl shadow-sm border border-[#EAECE4] text-xs font-bold text-stone-500 flex items-center gap-1 w-fit">Typing <span class="typing-dot w-1 h-1 bg-stone-400 rounded-full mx-[1px]"></span><span class="typing-dot w-1 h-1 bg-stone-400 rounded-full mx-[1px]"></span><span class="typing-dot w-1 h-1 bg-stone-400 rounded-full mx-[1px]"></span></div><form onsubmit="sendMessage(event)" class="bg-white p-4 border-t flex gap-3"><button type="button" class="p-3 text-stone-400 hover:text-[#556B2F] transition-colors"><i data-lucide="paperclip"></i></button><input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 p-3 bg-[#F4F5F0] border border-[#EAECE4] rounded-xl outline-none focus:border-[#556B2F] focus:ring-1 focus:ring-[#556B2F] transition-all" autocomplete="off"><button type="submit" class="bg-[#4B5320] text-white p-3 rounded-xl shadow-md hover:bg-[#556B2F] transition-transform active:scale-95"><i data-lucide="send" class="w-5 h-5 ml-1"></i></button></form></div>`;
                renderChatMessages();
            } else if (window.state.activeTab === 'teamMgmt') {
                const checkboxes = window.state.courses.map(c => `<label class="flex items-center gap-2 p-2 border rounded-lg bg-stone-50 cursor-pointer hover:bg-stone-100"><input type="checkbox" name="tm-courses" value="${c.id}" class="w-4 h-4 text-[#556B2F]"><span class="text-sm font-bold text-stone-700">${c.code}</span></label>`).join('');
                const list = window.state.teamMembers.map(m => `<div class="p-4 bg-white border rounded-xl flex justify-between items-center mb-3"><div><p class="font-bold text-lg">${m.name} <span class="text-sm font-normal text-stone-500 ml-2">ID: ${m.member_id}</span></p><div class="flex gap-2 mt-2">${(m.courses || []).map(cid => `<span class="px-2 py-1 bg-[#EAECE4] text-xs rounded font-bold text-stone-700">${getCourseCode(cid)}</span>`).join('')}</div></div><div class="flex gap-2"><button onclick="editTeamMember('${m.id}', '${m.member_id}', '${m.name.replace(/'/g, "\\'")}', '${(m.courses || []).join(',')}')" class="text-blue-500 bg-blue-50 p-3 rounded-lg hover:bg-blue-100"><i data-lucide="edit"></i></button><button onclick="deleteItem('team_members', '${m.id}')" class="text-red-500 bg-red-50 p-3 rounded-lg hover:bg-red-100"><i data-lucide="user-minus"></i></button></div></div>`).join('') || '<p class="text-stone-500 text-center py-8">No team members registered.</p>';
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">Team Management</h1><form onsubmit="addTeamMember(event)" id="tm-form" class="bg-white p-6 rounded-2xl border mb-8"><h2 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="user-plus" class="text-[#556B2F]"></i> <span id="tm-form-title">Register New Member</span></h2><input type="hidden" id="tm-doc-id" value=""><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4"><input type="text" id="tm-id" placeholder="Student ID (e.g. 106122)" class="p-3 border rounded-xl bg-stone-50" required><input type="text" id="tm-name" placeholder="Full Name" class="p-3 border rounded-xl bg-stone-50" required></div><p class="text-xs font-bold text-stone-500 uppercase mb-2">Assign Courses</p><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">${checkboxes}</div><button type="submit" id="tm-submit-btn" class="w-full bg-[#4B5320] text-white p-3 rounded-xl font-bold">Register Member</button><button type="button" id="tm-cancel-btn" onclick="cancelEditTm()" class="hidden w-full mt-2 text-stone-500 font-bold p-3 rounded-xl hover:bg-stone-100">Cancel Edit</button></form><div>${list}</div>`;
            } else if (window.state.activeTab === 'myTasks') {
                const options = window.state.courses.map(c => `<option value="${c.id}">${c.code}</option>`).join('');
                const list = window.state.myTasks.filter(t=>!t.completed).map(t => `<div class="flex justify-between p-4 bg-white border rounded-xl mb-3 items-center"><div class="flex items-center gap-4"><button onclick="toggleMyTask('${t.id}')" class="h-6 w-6 rounded-full border-2 border-[#D5D8C5] hover:bg-[#556B2F] hover:border-[#556B2F] transition-colors"></button><div><p class="font-bold text-stone-800">${t.title}</p><p class="text-xs text-stone-500">${getCourseCode(t.course_id)} | Due: ${t.due_date}</p></div></div><div class="flex gap-2"><button onclick="editMyTask('${t.id}', '${t.title.replace(/'/g, "\\'")}', '${t.course_id}', '${t.due_date}')" class="text-blue-500 bg-blue-50 p-2 rounded-lg hover:bg-blue-100"><i data-lucide="edit" class="w-4 h-4"></i></button><button onclick="deleteItem('tasks', '${t.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg hover:bg-red-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`).join('') || '<p class="text-stone-500 text-center py-8">No personal tasks yet.</p>';
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">Personal Tasks</h1><form onsubmit="addMyTask(event)" id="t-form" class="bg-white p-6 rounded-2xl border mb-8"><h2 class="font-bold mb-4 flex items-center gap-2"><i data-lucide="check-square" class="text-[#556B2F]"></i> <span id="t-form-title">Add New Task</span></h2><input type="hidden" id="t-id" value=""><div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4"><input type="text" id="t-title" placeholder="Task Name" class="col-span-1 md:col-span-2 p-3 border rounded-xl bg-stone-50" required><select id="t-course" class="p-3 border rounded-xl bg-stone-50" required><option value="" disabled selected>Course</option>${options}</select><input type="date" id="t-date" class="p-3 border rounded-xl bg-stone-50" required></div><button type="submit" id="t-submit-btn" class="w-full bg-[#4B5320] text-white p-3 rounded-xl font-bold">Add Task</button><button type="button" id="t-cancel-btn" onclick="cancelEditTask()" class="hidden w-full mt-2 text-stone-500 font-bold p-3 rounded-xl hover:bg-stone-100">Cancel Edit</button></form><div>${list}</div>`;
            } else if (window.state.activeTab === 'submissions') {
                const getStatusColor = (status) => { if(status === 'Pending') return 'bg-blue-50 border-blue-200 text-blue-800'; if(status === 'Reviewing') return 'bg-orange-50 border-orange-200 text-orange-800'; if(status === 'Approved') return 'bg-green-50 border-green-200 text-green-800'; if(status === 'Rejected') return 'bg-red-50 border-red-200 text-red-800'; };
                const list = window.state.submissions.map(s => {
                    const timeString = new Date(s.updated_at || s.created_at).toLocaleString('en-MY', { dateStyle: 'medium', timeStyle: 'short' });
                    return `<div class="p-4 border-2 rounded-xl mb-3 flex flex-col md:flex-row justify-between md:items-center gap-4 ${getStatusColor(s.status)}"><div><p class="font-bold text-lg">${s.title}</p><p class="text-sm">Submitted by: <span class="font-bold">${s.member_name}</span> | Course: ${getCourseCode(s.course_id)}</p><p class="text-xs text-stone-600 mt-1 font-medium"><i data-lucide="clock" class="inline w-3 h-3 mr-1"></i>${timeString}</p><a href="${s.file_url}" target="_blank" class="text-sm underline font-bold mt-2 inline-block"><i data-lucide="download-cloud" class="inline w-4 h-4 mr-1"></i>${s.file_name}</a></div><div class="flex gap-2 items-center"><select onchange="updateSubStatus('${s.id}', this.value)" class="p-2 border rounded-lg bg-white font-bold text-sm outline-none shadow-sm"><option value="Pending" ${s.status === 'Pending' ? 'selected' : ''}>🔵 Pending</option><option value="Reviewing" ${s.status === 'Reviewing' ? 'selected' : ''}>🟠 Reviewing</option><option value="Approved" ${s.status === 'Approved' ? 'selected' : ''}>🟢 Approved</option><option value="Rejected" ${s.status === 'Rejected' ? 'selected' : ''}>🔴 Rejected</option></select><button onclick="deleteItem('submissions', '${s.id}')" class="p-2 bg-white rounded-lg hover:bg-stone-100 text-stone-500 shadow-sm"><i data-lucide="trash"></i></button></div></div>`}).join('') || '<p class="text-stone-500 text-center py-8">No submissions yet.</p>';
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">Submitted Tasks</h1><div class="bg-white p-4 rounded-xl border mb-6 flex gap-4 text-xs font-bold justify-center flex-wrap"><span class="px-3 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-200">Pending</span><span class="px-3 py-1 bg-orange-50 text-orange-700 rounded-full border border-orange-200">Reviewing</span><span class="px-3 py-1 bg-green-50 text-green-700 rounded-full border border-green-200">Approved</span><span class="px-3 py-1 bg-red-50 text-red-700 rounded-full border border-red-200">Rejected</span></div><div>${list}</div>`;
            } else if (window.state.activeTab === 'courses') {
                const list = window.state.courses.map(c => `<div class="flex justify-between items-center p-4 border-b last:border-0 bg-white"><div><span class="font-bold mr-3">${c.code}</span><span class="text-stone-600">${c.name}</span></div><button onclick="deleteItem('courses', '${c.id}')" class="text-red-500"><i data-lucide="trash-2"></i></button></div>`).join('');
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">Courses</h1><form onsubmit="addCourse(event)" class="bg-white p-5 rounded-2xl border mb-6 flex gap-3"><input type="text" id="c-code" placeholder="Code" class="w-32 p-3 border rounded-xl" required><input type="text" id="c-name" placeholder="Course Name" class="flex-1 p-3 border rounded-xl" required><button type="submit" class="bg-[#4B5320] text-white px-6 rounded-xl font-bold">Add</button></form><div class="border rounded-2xl overflow-hidden">${list}</div>`;
            } else if (window.state.activeTab === 'announcements') {
                const list = window.state.announcements.map(a => `<div class="p-4 bg-white border rounded-xl mb-3 flex justify-between"><p>${a.content}</p><button onclick="deleteItem('announcements', '${a.id}')" class="text-red-500"><i data-lucide="trash-2"></i></button></div>`).join('');
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">Broadcast Announcement</h1><form onsubmit="addAnnouncement(event)" class="mb-8"><textarea id="ann-content" placeholder="Type announcement..." class="w-full p-4 border rounded-xl bg-white min-h-[100px] mb-3" required></textarea><button type="submit" class="bg-[#8B4513] text-white px-6 py-3 rounded-lg font-bold">Post Notice</button></form><div>${list}</div>`;
            } else if (window.state.activeTab === 'exams') {
                const list = window.state.exams.map(e => `<div class="bg-white p-6 rounded-2xl border flex justify-between relative group"><div><span class="text-xs font-black text-rose-700 uppercase">${e.type}</span><h3 class="text-xl font-bold">${getCourseCode(e.course_id)}</h3><p class="text-sm mt-2"><i data-lucide="calendar" class="inline w-4 h-4"></i> ${e.date}</p></div><button onclick="deleteItem('exams', '${e.id}')" class="text-red-500"><i data-lucide="trash-2"></i></button></div>`).join('');
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">Exams</h1><form onsubmit="addExam(event)" class="bg-white p-5 rounded-2xl border mb-6 flex gap-3"><select id="e-course" class="p-3 border rounded-xl"><option value="">Course</option>${window.state.courses.map(c=>`<option value="${c.id}">${c.code}</option>`)}</select><select id="e-type" class="p-3 border rounded-xl"><option>Quiz</option><option>Midterm</option><option>Final</option></select><input type="date" id="e-date" class="p-3 border rounded-xl" required><button type="submit" class="bg-rose-700 text-white px-6 rounded-xl font-bold">Add</button></form><div class="grid grid-cols-2 gap-4">${list}</div>`;
            } else if (window.state.activeTab === 'timer') {
                const ts = window.timerState;
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">Timer</h1><div class="p-8 rounded-[2rem] border-4 flex flex-col items-center bg-white mb-6"><div id="timer-display-time" class="text-7xl font-black mb-10 text-stone-800">00:00:00</div><div class="flex gap-4"><button onclick="toggleTimer()" class="px-8 py-4 rounded-xl font-black text-white bg-[#4B5320] hover:bg-[#556B2F] uppercase">${ts.isActive ? 'Pause' : 'Start'}</button><button onclick="resetTimer()" class="px-6 py-4 rounded-xl font-bold bg-[#EAECE4]">Reset</button><button onclick="finishSession()" class="px-6 py-4 rounded-xl font-bold bg-[#8B4513] text-white">Save</button></div></div>`;
            } else if (window.state.activeTab === 'history') {
                const list = window.state.myTasks.filter(t=>t.completed).map(t => `<div class="p-4 border-b bg-white"><p class="line-through font-bold">${t.title}</p></div>`).join('');
                main.innerHTML = `<h1 class="text-3xl font-bold mb-6">History</h1><div class="border rounded-2xl overflow-hidden">${list}</div>`;
            }
            lucide.createIcons();
            if(window.state.activeTab === 'timer' && document.getElementById('timer-display-time')) document.getElementById('timer-display-time').innerText = formatTime(window.timerState.timeSeconds);
        }

        lucide.createIcons();
    </script>
</body>
</html>
