<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentSync | Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #D5D8C5; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #556B2F; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Background pattern styling */
        .bg-decor { pointer-events: none; opacity: 0.03; position: fixed; z-index: 0; color: black; }
        
        /* Toast Notification */
        #toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #4B5320; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(20px); white-space: nowrap; }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-[#F4F5F0] text-stone-900 font-sans h-[100dvh] overflow-hidden relative">

    <!-- Background Decor -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.03] flex flex-wrap justify-around items-center z-0 overflow-hidden">
        <i data-lucide="graduation-cap" class="w-64 h-64 rotate-12"></i>
        <i data-lucide="book-open" class="w-96 h-96 -rotate-12"></i>
        <i data-lucide="library" class="w-72 h-72 rotate-45"></i>
        <i data-lucide="check-circle-2" class="w-48 h-48 -rotate-6"></i>
    </div>

    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-view" class="hidden absolute inset-0 bg-[#F4F5F0] z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-[#EAECE4] relative z-10">
            <div class="flex justify-center mb-4">
                <div class="p-4 bg-[#F4F5F0] rounded-full">
                    <i data-lucide="graduation-cap" class="h-10 w-10 text-[#556B2F]"></i>
                </div>
            </div>
            <h2 class="text-2xl font-black text-center text-stone-800 mb-2">StudentSync</h2>
            <p class="text-center text-stone-500 mb-8 text-sm font-medium">Log in to sync across your phone and laptop</p>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1 pl-1">Email</label>
                        <input type="email" id="auth-email" placeholder="student@university.edu" class="w-full p-4 border border-[#D5D8C5] rounded-2xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-stone-500 uppercase tracking-wider mb-1 pl-1">Password</label>
                        <input type="password" id="auth-password" placeholder="••••••••" class="w-full p-4 border border-[#D5D8C5] rounded-2xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required>
                    </div>
                    <div class="flex gap-3 pt-4">
                        <button type="submit" onclick="window.authMode='login'" class="flex-1 bg-[#4B5320] text-white p-4 rounded-2xl font-bold hover:bg-[#556B2F] transition-transform active:scale-95 shadow-md">Log In</button>
                        <button type="submit" onclick="window.authMode='signup'" class="flex-1 bg-[#EAECE4] text-stone-700 p-4 rounded-2xl font-bold hover:bg-[#D5D8C5] transition-transform active:scale-95">Sign Up</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="app-layout" class="hidden flex-col md:flex-row h-full w-full z-10 relative">
        
        <!-- Mobile Top Bar -->
        <div class="md:hidden bg-[#4B5320] text-white p-4 font-bold text-xl flex items-center justify-between shadow-md z-20 shrink-0">
            <span>StudentSync</span>
            <i data-lucide="graduation-cap" class="h-6 w-6 text-[#DCD7A0]"></i>
        </div>

        <!-- Sidebar / Nav (Fixed to bottom on mobile) -->
        <nav class="fixed md:relative bottom-0 left-0 w-full md:w-64 bg-[#EAECE4] border-t border-[#D5D8C5] md:border-t-0 md:border-r z-50 flex flex-col shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] md:shadow-none">
            <div class="hidden md:flex bg-[#4B5320] text-white p-6 font-bold text-2xl items-center gap-3 shadow-md shrink-0">
                <i data-lucide="graduation-cap" class="h-8 w-8 text-[#DCD7A0]"></i>
                <span>StudentSync</span>
            </div>
            <!-- Navigation Items Container -->
            <div class="flex md:flex-col justify-start md:justify-around p-2 md:p-4 gap-2 h-16 md:h-full overflow-x-auto md:overflow-y-auto no-scrollbar shrink-0" id="nav-container">
                <!-- Nav items injected here -->
            </div>
        </nav>

        <!-- Main Content (Padding bottom added to prevent content hiding behind fixed mobile nav) -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 z-10 relative" id="app-content">
            <div class="max-w-6xl mx-auto h-full" id="main-view">
                <!-- Loading Spinner -->
                <div class="flex items-center justify-center h-full">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#556B2F]"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <script type="module">
        // --- FIREBASE IMPORTS ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // ADDED Email/Password Auth methods to solve the Syncing issue across devices
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ✅ YOUR FIREBASE CONFIGURATION ✅
        const firebaseConfig = {
            apiKey: "AIzaSyAbxmPrqFkiYHeizx-b0AEOERF7WO_Rn9g",
            authDomain: "studentsync-a28b5.firebaseapp.com",
            projectId: "studentsync-a28b5",
            storageBucket: "studentsync-a28b5.firebasestorage.app",
            messagingSenderId: "790725463704",
            appId: "1:790725463704:web:9db73998331b6ee2dd0aed",
            measurementId: "G-S65NEWN02J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- GLOBAL STATE ---
        const state = {
            user: null,
            activeTab: 'dashboard',
            courses: [],
            tasks: [],
            exams: [],
            teamTasks: [],
            studySessions: []
        };

        // --- TIMER STATE ---
        const timerState = {
            mode: 'stopwatch',
            isActive: false,
            timeSeconds: 0,
            isBreak: false,
            inputMinutes: 60,
            courseId: '',
            intervalRef: null
        };

        let unsubscribes = [];

        // --- UTILS ---
        const toTitleCase = (str) => str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        
        window.showToast = (message) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        const getUrgencyStyles = (dateString) => {
            const days = (new Date(dateString).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / (1000 * 60 * 60 * 24);
            if (days < 3) return 'bg-red-50 border-red-200 border-l-4 border-l-red-500';
            if (days <= 7) return 'bg-orange-50 border-orange-200 border-l-4 border-l-orange-500';
            return 'bg-[#F9FAF8] border-[#EAECE4] border-l-4 border-l-[#556B2F]';
        };

        const getCourseCode = (id) => state.courses.find(c => c.id === id)?.code || 'Unknown Course';

        const formatTime = (totalSeconds) => {
            const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (totalSeconds % 60).toString().padStart(2, '0');
            return timerState.mode === 'stopwatch' ? `${h}:${m}:${s}` : `${m}:${s}`;
        };

        const playAlarm = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) { console.log("Audio not supported"); }
        };

        // --- INIT & AUTH ---
        function init() {
            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) {
                    // Show App, Hide Auth
                    document.getElementById('auth-view').classList.add('hidden');
                    document.getElementById('app-layout').classList.remove('hidden');
                    document.getElementById('app-layout').classList.add('flex');
                    setupListeners();
                } else {
                    // Show Auth, Hide App
                    document.getElementById('auth-view').classList.remove('hidden');
                    document.getElementById('app-layout').classList.add('hidden');
                    document.getElementById('app-layout').classList.remove('flex');
                    // Clear listeners to prevent memory leaks if switching accounts
                    unsubscribes.forEach(unsub => unsub());
                    unsubscribes = [];
                }
            });
            lucide.createIcons();
        }

        // Handle Login and Signup Forms
        window.handleAuth = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                if (window.authMode === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                    showToast("Logged in successfully!");
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    showToast("Account created! Sync activated.");
                }
                document.getElementById('auth-password').value = '';
            } catch (error) {
                // Display user friendly error messages
                showToast(error.message.replace('Firebase: ', '').replace(/\(auth.*\)\./, ''));
            }
        };

        // Added Logout function
        window.logout = async () => {
            await signOut(auth);
            state.activeTab = 'dashboard'; // reset view
            showToast("Logged out successfully");
        };

        function setupListeners() {
            const { uid } = state.user;
            
            unsubscribes.push(onSnapshot(collection(db, 'users', uid, 'courses'), (snap) => {
                state.courses = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => a.code.localeCompare(b.code));
                renderApp();
            }));

            unsubscribes.push(onSnapshot(collection(db, 'users', uid, 'tasks'), (snap) => {
                state.tasks = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                });
                renderApp();
            }));

            unsubscribes.push(onSnapshot(collection(db, 'users', uid, 'exams'), (snap) => {
                state.exams = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => new Date(a.date) - new Date(b.date));
                renderApp();
            }));

            unsubscribes.push(onSnapshot(collection(db, 'users', uid, 'teamTasks'), (snap) => {
                state.teamTasks = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    return new Date(a.checkDate) - new Date(b.checkDate);
                });
                renderApp();
            }));

            unsubscribes.push(onSnapshot(collection(db, 'users', uid, 'studySessions'), (snap) => {
                state.studySessions = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => b.timestamp - a.timestamp);
                renderApp();
            }));
        }

        // --- GLOBAL ACTIONS EXPOSED TO WINDOW ---
        window.switchTab = (tab) => { 
            if (tab === 'logout') {
                window.logout();
                return;
            }
            state.activeTab = tab; 
            renderApp(); 
        };

        // Toggle / Delete
        window.toggleTask = async (id, isTeam = false) => {
            const list = isTeam ? state.teamTasks : state.tasks;
            const task = list.find(t => t.id === id);
            if(!task) return;
            const ref = doc(db, 'users', state.user.uid, isTeam ? 'teamTasks' : 'tasks', id);
            await updateDoc(ref, { completed: !task.completed, completedAt: !task.completed ? Date.now() : null });
        };
        window.deleteDocItem = async (colName, id) => {
            if(colName === 'courses' && !confirm("Delete this course?")) return;
            await deleteDoc(doc(db, 'users', state.user.uid, colName, id));
            showToast("Item deleted.");
        };

        // Form Adds
        window.addCourse = async (e) => {
            e.preventDefault();
            const code = document.getElementById('c-code').value.toUpperCase();
            const name = toTitleCase(document.getElementById('c-name').value);
            if(!code) return;
            await addDoc(collection(db, 'users', state.user.uid, 'courses'), { code, name, createdAt: Date.now() });
            showToast("Course Added");
        };
        window.addTask = async (e) => {
            e.preventDefault();
            const title = document.getElementById('t-title').value;
            const courseId = document.getElementById('t-course').value;
            const dueDate = document.getElementById('t-date').value;
            await addDoc(collection(db, 'users', state.user.uid, 'tasks'), { title, courseId, dueDate, completed: false, completedAt: null, createdAt: Date.now() });
            showToast("Assignment Added");
        };
        window.addTeamTask = async (e) => {
            e.preventDefault();
            const title = document.getElementById('tm-title').value;
            const courseId = document.getElementById('tm-course').value;
            const checkDate = document.getElementById('tm-date').value;
            await addDoc(collection(db, 'users', state.user.uid, 'teamTasks'), { title, courseId, checkDate, completed: false, completedAt: null, createdAt: Date.now() });
            showToast("Team Task Added");
        };
        window.addExam = async (e) => {
            e.preventDefault();
            const courseId = document.getElementById('e-course').value;
            const type = document.getElementById('e-type').value;
            const date = document.getElementById('e-date').value;
            await addDoc(collection(db, 'users', state.user.uid, 'exams'), { courseId, type, date, createdAt: Date.now() });
            showToast("Exam Scheduled");
        };

        // --- TIMER LOGIC ---
        window.setTimerMode = (mode) => {
            timerState.mode = mode;
            if(mode === 'pomodoro') timerState.isBreak = false;
            window.resetTimer();
        };
        window.toggleTimer = () => {
            if(!timerState.isActive && timerState.timeSeconds === 0) {
                if(timerState.mode === 'pomodoro') timerState.timeSeconds = timerState.isBreak ? 5*60 : 25*60;
                else if(timerState.mode === 'countdown') {
                    const el = document.getElementById('timer-input-mins');
                    timerState.inputMinutes = el ? Number(el.value) : timerState.inputMinutes;
                    timerState.timeSeconds = timerState.inputMinutes * 60;
                }
            }
            timerState.isActive = !timerState.isActive;
            if(timerState.isActive) {
                timerState.intervalRef = setInterval(() => {
                    if (timerState.mode === 'stopwatch') {
                        timerState.timeSeconds++;
                    } else {
                        if (timerState.timeSeconds <= 1) {
                            clearInterval(timerState.intervalRef);
                            timerState.isActive = false;
                            timerState.timeSeconds = 0;
                            playAlarm();
                            if (timerState.mode === 'pomodoro') {
                                if (!timerState.isBreak) showToast("Pomodoro complete! Take a break.");
                                else showToast("Break over! Ready to focus?");
                            } else {
                                showToast("Mock Exam Time's Up!");
                            }
                        } else {
                            timerState.timeSeconds--;
                        }
                    }
                    renderTimerOnly();
                }, 1000);
            } else {
                clearInterval(timerState.intervalRef);
            }
            renderApp();
        };
        window.resetTimer = () => {
            clearInterval(timerState.intervalRef);
            timerState.isActive = false;
            timerState.timeSeconds = 0;
            renderApp();
        };
        window.setBreak = (isBreak) => {
            timerState.isBreak = isBreak;
            window.resetTimer();
        };
        window.updateCourseId = (val) => timerState.courseId = val;
        window.updateInputMins = (val) => timerState.inputMinutes = val;
        
        window.finishSession = async () => {
            let durationSaved = 0;
            if (timerState.mode === 'stopwatch') durationSaved = timerState.timeSeconds;
            else if (timerState.mode === 'pomodoro') durationSaved = (timerState.isBreak ? 5*60 : 25*60) - timerState.timeSeconds;
            else if (timerState.mode === 'countdown') durationSaved = (timerState.inputMinutes * 60) - timerState.timeSeconds;

            if (durationSaved < 5) {
                showToast("Session too short to log (< 5s).");
                window.resetTimer();
                timerState.courseId = '';
                return;
            }

            timerState.isActive = false;
            clearInterval(timerState.intervalRef);
            await addDoc(collection(db, 'users', state.user.uid, 'studySessions'), {
                courseId: timerState.courseId || 'General',
                duration: durationSaved,
                timestamp: Date.now(),
                mode: timerState.mode
            });
            window.resetTimer();
            timerState.courseId = '';
            showToast("Session Saved!");
        };

        function renderTimerOnly() {
            const display = document.getElementById('timer-display-time');
            if(display) {
                let displaySecs = timerState.timeSeconds === 0 && !timerState.isActive ? 
                    (timerState.mode === 'pomodoro' ? (timerState.isBreak? 5*60 : 25*60) : (timerState.mode === 'countdown' ? timerState.inputMinutes*60 : 0)) 
                    : timerState.timeSeconds;
                display.innerText = formatTime(displaySecs);
            }
        }

        // --- RENDERERS ---
        function renderNav() {
            const navItems = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
                { id: 'courses', icon: 'library', label: 'Courses' },
                { id: 'tasks', icon: 'check-circle-2', label: 'My Tasks' },
                { id: 'team', icon: 'users', label: 'Team' },
                { id: 'exams', icon: 'calendar', label: 'Exams' },
                { id: 'timer', icon: 'clock', label: 'Timer' },
                { id: 'divider', type: 'divider' },
                { id: 'history', icon: 'history', label: 'History' },
                { id: 'logout', icon: 'log-out', label: 'Logout', extraClass: 'text-red-600 hover:bg-red-50' }, // Added logout
            ];

            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = navItems.map(item => {
                if(item.type === 'divider') return `<div class="hidden md:block my-2 border-t border-[#D5D8C5] shrink-0"></div>`;
                const isActive = state.activeTab === item.id;
                const baseClass = item.extraClass ? item.extraClass : 'text-stone-600 hover:bg-[#D5D8C5] hover:text-stone-900';
                const classes = isActive ? 'bg-[#556B2F] text-white font-semibold shadow-md translate-x-0 md:translate-x-2' : baseClass;
                return `
                    <button onclick="switchTab('${item.id}')" class="flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:p-3 rounded-xl transition-all flex-shrink-0 justify-center md:justify-start min-w-[64px] ${classes}">
                        <i data-lucide="${item.icon}" class="h-5 w-5 md:h-5 md:w-5"></i>
                        <span class="text-[10px] md:text-sm">${item.label}</span>
                    </button>
                `;
            }).join('');
        }

        function renderApp() {
            if (!state.user) return;
            renderNav();
            
            const main = document.getElementById('main-view');
            let html = '';

            if (state.activeTab === 'dashboard') html = renderDashboard();
            else if (state.activeTab === 'courses') html = renderCourses();
            else if (state.activeTab === 'tasks') html = renderTasks();
            else if (state.activeTab === 'team') html = renderTeam();
            else if (state.activeTab === 'exams') html = renderExams();
            else if (state.activeTab === 'timer') html = renderTimer();
            else if (state.activeTab === 'history') html = renderHistory();

            main.innerHTML = html;
            lucide.createIcons();
            if(state.activeTab === 'timer') renderTimerOnly();
        }

        // --- TAB RENDERING LOGIC ---
        function renderDashboard() {
            const pendingTasks = state.tasks.filter(t => !t.completed).length;
            const pendingTeam = state.teamTasks.filter(t => !t.completed).length;
            const upcomingExams = state.exams.filter(e => new Date(e.date) >= new Date(new Date().setHours(0,0,0,0))).length;
            
            const totalMins = state.studySessions.reduce((tot, s) => tot + Math.floor(s.duration / 60), 0);
            const hrs = Math.floor(totalMins / 60);
            const mins = totalMins % 60;

            const tList = state.tasks.filter(t=>!t.completed).slice(0,4).map(t => `
                <div class="flex items-start gap-3 p-3 rounded-xl shadow-sm hover:shadow-md transition-all ${getUrgencyStyles(t.dueDate)}">
                    <button onclick="toggleTask('${t.id}', false)" class="mt-0.5 h-5 w-5 rounded-full border-2 border-[#556B2F]/40 flex-shrink-0 flex items-center justify-center hover:bg-[#556B2F] hover:border-[#556B2F] text-transparent hover:text-white transition-colors"><i data-lucide="check-circle-2" class="h-3 w-3"></i></button>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start gap-2"><span class="font-bold text-stone-800 truncate">${t.title}</span><span class="text-[10px] font-black px-1.5 py-0.5 bg-white rounded shadow-sm border border-black/5 whitespace-nowrap">${new Date(t.dueDate).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span></div>
                        <span class="text-xs text-stone-600 mt-1 font-medium">${getCourseCode(t.courseId)}</span>
                    </div>
                </div>
            `).join('') || `<p class="text-sm text-stone-500 italic p-4 text-center bg-stone-50 rounded-xl h-full flex items-center justify-center">All caught up!</p>`;

            const tmList = state.teamTasks.filter(t=>!t.completed).slice(0,4).map(t => `
                 <div class="flex items-start gap-3 p-3 rounded-xl shadow-sm hover:shadow-md transition-all ${getUrgencyStyles(t.checkDate)}">
                    <button onclick="toggleTask('${t.id}', true)" class="mt-0.5 h-5 w-5 rounded border-2 border-[#8B4513]/40 flex-shrink-0 flex items-center justify-center hover:bg-[#8B4513] hover:border-[#8B4513] text-transparent hover:text-white transition-colors"><i data-lucide="check-circle-2" class="h-3 w-3"></i></button>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start gap-2"><span class="font-bold text-stone-800 truncate">${t.title}</span><span class="text-[10px] font-black px-1.5 py-0.5 bg-white rounded shadow-sm border border-black/5 whitespace-nowrap">${new Date(t.checkDate).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span></div>
                        <span class="text-xs text-stone-600 mt-1 font-medium">${getCourseCode(t.courseId)}</span>
                    </div>
                </div>
            `).join('') || `<p class="text-sm text-stone-500 italic p-4 text-center bg-stone-50 rounded-xl h-full flex items-center justify-center">No team deliverables to monitor.</p>`;

            const eList = state.exams.filter(e => new Date(e.date) >= new Date(new Date().setHours(0,0,0,0))).slice(0,4).map(e => `
                <div class="flex flex-col p-3 rounded-xl shadow-sm ${getUrgencyStyles(e.date)}">
                    <div class="flex justify-between items-start"><span class="font-black text-stone-800">${getCourseCode(e.courseId)}</span><span class="text-[10px] font-black px-1.5 py-0.5 bg-white rounded shadow-sm border border-black/5 whitespace-nowrap text-rose-700">${new Date(e.date).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</span></div>
                    <span class="text-xs text-stone-600 mt-1 font-medium uppercase tracking-wider">${e.type}</span>
                </div>
            `).join('') || `<p class="text-sm text-stone-500 italic p-4 text-center bg-stone-50 rounded-xl h-full flex items-center justify-center">No upcoming exams.</p>`;

            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold text-stone-800">Overview</h1>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col md:flex-row items-start md:items-center gap-3 md:gap-4"><div class="p-3 bg-[#F4F5F0] rounded-xl"><i data-lucide="check-circle-2" class="text-[#556B2F]"></i></div><div><p class="text-[10px] md:text-xs text-stone-500 font-bold uppercase tracking-wider">My Tasks</p><p class="text-xl md:text-2xl font-black text-stone-800">${pendingTasks}</p></div></div>
                        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col md:flex-row items-start md:items-center gap-3 md:gap-4"><div class="p-3 bg-[#F4F5F0] rounded-xl"><i data-lucide="users" class="text-[#8B4513]"></i></div><div><p class="text-[10px] md:text-xs text-stone-500 font-bold uppercase tracking-wider">Team Checks</p><p class="text-xl md:text-2xl font-black text-stone-800">${pendingTeam}</p></div></div>
                        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col md:flex-row items-start md:items-center gap-3 md:gap-4"><div class="p-3 bg-[#F4F5F0] rounded-xl"><i data-lucide="calendar" class="text-rose-600"></i></div><div><p class="text-[10px] md:text-xs text-stone-500 font-bold uppercase tracking-wider">Exams</p><p class="text-xl md:text-2xl font-black text-stone-800">${upcomingExams}</p></div></div>
                        <div class="bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col md:flex-row items-start md:items-center gap-3 md:gap-4"><div class="p-3 bg-[#F4F5F0] rounded-xl"><i data-lucide="clock" class="text-[#4B5320]"></i></div><div><p class="text-[10px] md:text-xs text-stone-500 font-bold uppercase tracking-wider">Focus Time</p><p class="text-xl md:text-2xl font-black text-stone-800">${hrs}h ${mins}m</p></div></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col"><h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-stone-800 border-b border-[#F4F5F0] pb-2"><i data-lucide="book-open" class="h-5 w-5 text-[#556B2F]"></i>Next Assignments</h2><div class="space-y-3 flex-1">${tList}</div></div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col"><h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-stone-800 border-b border-[#F4F5F0] pb-2"><i data-lucide="users" class="h-5 w-5 text-[#8B4513]"></i>Team Watchlist</h2><div class="space-y-3 flex-1">${tmList}</div></div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-[#EAECE4] flex flex-col"><h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-stone-800 border-b border-[#F4F5F0] pb-2"><i data-lucide="graduation-cap" class="h-5 w-5 text-rose-600"></i>Approaching Exams</h2><div class="space-y-3 flex-1">${eList}</div></div>
                    </div>
                </div>`;
        }

        function renderCourses() {
            const list = state.courses.map(c => `
                <div class="flex justify-between items-center p-4 border-b border-[#EAECE4] last:border-0 hover:bg-[#F9FAF8]">
                    <div><span class="font-bold text-stone-800 mr-3">${c.code}</span><span class="text-stone-600">${c.name}</span></div>
                    <button onclick="deleteDocItem('courses', '${c.id}')" class="text-stone-400 hover:text-red-600 p-2"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                </div>
            `).join('') || `<div class="p-8 text-center text-stone-500 flex flex-col items-center gap-3"><i data-lucide="library" class="h-12 w-12 text-[#D5D8C5]"></i><p>No courses added yet. Add your semester subjects above!</p></div>`;
            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold text-stone-800">Registered Courses</h1>
                    <form onsubmit="addCourse(event)" class="bg-white p-5 rounded-2xl shadow-sm border border-[#EAECE4] grid grid-cols-1 md:grid-cols-5 gap-3">
                        <input type="text" id="c-code" placeholder="Code (e.g. MPU3182)" class="md:col-span-1 p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8] uppercase" required/>
                        <input type="text" id="c-name" placeholder="Course Name" class="md:col-span-3 p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required/>
                        <button type="submit" class="bg-[#4B5320] text-white p-3 rounded-xl hover:bg-[#556B2F] flex items-center justify-center gap-2 font-bold"><i data-lucide="plus" class="h-5 w-5"></i> Add</button>
                    </form>
                    <div class="bg-white rounded-2xl shadow-sm border border-[#EAECE4] overflow-hidden">${list}</div>
                </div>`;
        }

        function renderTasks() {
            const options = state.courses.map(c => `<option value="${c.id}">${c.code}</option>`).join('');
            const list = state.tasks.map(t => `
                <div class="flex items-center justify-between p-4 rounded-xl shadow-sm transition-all ${t.completed ? 'bg-stone-100 border border-[#EAECE4] opacity-75' : 'bg-white border border-[#EAECE4]'}">
                    <div class="flex items-center gap-4 flex-1 overflow-hidden">
                        <button onclick="toggleTask('${t.id}', false)" class="h-7 w-7 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-colors ${t.completed ? 'bg-[#556B2F] border-[#556B2F] text-white' : 'border-[#D5D8C5] text-transparent hover:border-[#556B2F]'}"><i data-lucide="check-circle-2" class="h-4 w-4"></i></button>
                        <div class="truncate pr-4 flex flex-col">
                            <p class="font-bold truncate ${t.completed ? 'line-through text-stone-500' : 'text-stone-800'}">${t.title}</p>
                            <div class="flex gap-3 text-xs font-medium text-stone-500 mt-1"><span class="text-[#556B2F] bg-[#EAECE4] px-2 py-0.5 rounded">${getCourseCode(t.courseId)}</span><span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> Due: ${new Date(t.dueDate).toLocaleDateString()}</span></div>
                        </div>
                    </div>
                    <button onclick="deleteDocItem('tasks', '${t.id}')" class="text-stone-400 hover:text-red-500 p-2"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                </div>
            `).join('');
            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold text-stone-800">My Assignments</h1>
                    <form onsubmit="addTask(event)" class="bg-white p-5 rounded-2xl shadow-sm border border-[#EAECE4] grid grid-cols-1 md:grid-cols-5 gap-3">
                        <input type="text" id="t-title" placeholder="Task Name" class="md:col-span-2 p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required/>
                        <select id="t-course" class="p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required><option value="" disabled selected>Select Course</option>${options}</select>
                        <input type="date" id="t-date" class="p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required/>
                        <button type="submit" class="bg-[#4B5320] text-white p-3 rounded-xl hover:bg-[#556B2F] flex items-center justify-center gap-2 font-bold"><i data-lucide="plus" class="h-5 w-5"></i> Add</button>
                    </form>
                    <div class="space-y-3">${list}</div>
                </div>`;
        }

        function renderTeam() {
            const options = state.courses.map(c => `<option value="${c.id}">${c.code}</option>`).join('');
            const list = state.teamTasks.map(t => `
                <div class="flex items-center justify-between p-4 rounded-xl shadow-sm transition-all ${t.completed ? 'bg-stone-100 border border-[#EAECE4] opacity-75' : 'bg-white border border-[#8B4513]/30 border-l-4 border-l-[#8B4513]'}">
                    <div class="flex items-center gap-4 flex-1 overflow-hidden">
                        <button onclick="toggleTask('${t.id}', true)" class="h-7 w-7 rounded-md border-2 flex-shrink-0 flex items-center justify-center transition-colors ${t.completed ? 'bg-[#8B4513] border-[#8B4513] text-white' : 'border-[#D5D8C5] text-transparent hover:border-[#8B4513]'}"><i data-lucide="check-circle-2" class="h-4 w-4"></i></button>
                        <div class="truncate pr-4 flex flex-col">
                            <p class="font-bold truncate ${t.completed ? 'line-through text-stone-500' : 'text-stone-800'}">${t.title}</p>
                            <div class="flex gap-3 text-xs font-medium text-stone-500 mt-1"><span class="text-[#8B4513] bg-[#F4F5F0] px-2 py-0.5 rounded border border-[#EAECE4]">${getCourseCode(t.courseId)}</span><span>Check by: ${new Date(t.checkDate).toLocaleDateString()}</span></div>
                        </div>
                    </div>
                    <button onclick="deleteDocItem('teamTasks', '${t.id}')" class="text-stone-400 hover:text-red-500 p-2"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                </div>
            `).join('') || `<p class="text-center text-stone-500 mt-8">No team tracking tasks yet.</p>`;
            return `
                <div class="space-y-6">
                    <div class="flex items-center gap-3"><i data-lucide="users" class="h-8 w-8 text-[#8B4513]"></i><h1 class="text-3xl font-bold text-stone-800">Team Tracker</h1></div>
                    <form onsubmit="addTeamTask(event)" class="bg-[#EAECE4] p-5 rounded-2xl shadow-sm border border-[#D5D8C5] grid grid-cols-1 md:grid-cols-5 gap-3">
                        <input type="text" id="tm-title" placeholder="What to check?" class="md:col-span-2 p-3 border border-white rounded-xl focus:ring-2 focus:ring-[#8B4513] outline-none" required/>
                        <select id="tm-course" class="p-3 border border-white rounded-xl focus:ring-2 focus:ring-[#8B4513] outline-none" required><option value="" disabled selected>Select Course</option>${options}</select>
                        <input type="date" id="tm-date" class="p-3 border border-white rounded-xl focus:ring-2 focus:ring-[#8B4513] outline-none" required/>
                        <button type="submit" class="bg-[#8B4513] text-white p-3 rounded-xl hover:bg-[#A0522D] flex items-center justify-center gap-2 font-bold"><i data-lucide="plus" class="h-5 w-5"></i> Add</button>
                    </form>
                    <div class="space-y-3">${list}</div>
                </div>`;
        }

        function renderExams() {
            const options = state.courses.map(c => `<option value="${c.id}">${c.code}</option>`).join('');
            const list = state.exams.map(e => {
                const course = state.courses.find(c => c.id === e.courseId);
                return `
                <div class="bg-white p-6 rounded-2xl border border-[#EAECE4] shadow-sm flex flex-col relative overflow-hidden group">
                    <div class="absolute top-0 left-0 w-2 h-full bg-rose-700"></div>
                    <button onclick="deleteDocItem('exams', '${e.id}')" class="absolute top-4 right-4 text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="trash-2" class="h-5 w-5"></i></button>
                    <span class="text-xs font-black text-rose-700 uppercase tracking-wider mb-2">${e.type}</span>
                    <h3 class="text-2xl font-bold text-stone-800 mb-1">${course ? course.code : 'Unknown'}</h3>
                    <p class="text-sm text-stone-500 mb-4">${course ? course.name : ''}</p>
                    <div class="flex items-center gap-2 text-stone-700 mt-auto pt-4 border-t border-[#F4F5F0]">
                        <i data-lucide="calendar" class="h-5 w-5 text-rose-700"></i><span class="font-bold">${new Date(e.date).toLocaleDateString(undefined, {weekday:'long', year:'numeric', month:'long', day:'numeric'})}</span>
                    </div>
                </div>`;
            }).join('');
            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold text-stone-800">Exam Schedule</h1>
                    <form onsubmit="addExam(event)" class="bg-white p-5 rounded-2xl shadow-sm border border-[#EAECE4] grid grid-cols-1 md:grid-cols-4 gap-3">
                        <select id="e-course" class="p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required><option value="" disabled selected>Select Course</option>${options}</select>
                        <select id="e-type" class="p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]"><option>Quiz</option><option selected>Midterm</option><option>Final</option><option>Practical</option></select>
                        <input type="date" id="e-date" class="p-3 border border-[#D5D8C5] rounded-xl focus:ring-2 focus:ring-[#556B2F] outline-none bg-[#F9FAF8]" required/>
                        <button type="submit" class="bg-rose-700 text-white p-3 rounded-xl hover:bg-rose-800 flex items-center justify-center gap-2 font-bold"><i data-lucide="plus" class="h-5 w-5"></i> Add Exam</button>
                    </form>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${list}</div>
                </div>`;
        }

        function renderTimer() {
            const m = timerState.mode;
            const bgClass = m === 'pomodoro' ? (timerState.isBreak ? 'bg-blue-50 border-blue-200' : 'bg-red-50 border-red-200') : 'bg-white border-[#EAECE4]';
            const textClass = m === 'pomodoro' ? (timerState.isBreak ? 'text-blue-800' : 'text-red-800') : 'text-stone-800';
            const btnClass = timerState.isActive ? 'bg-[#8B4513] hover:bg-[#A0522D]' : 'bg-[#4B5320] hover:bg-[#556B2F]';
            
            const options = state.courses.map(c => `<option value="${c.id}" ${timerState.courseId===c.id?'selected':''}>${c.code}</option>`).join('');
            
            let extraUI = '';
            if (m === 'countdown' && !timerState.isActive && timerState.timeSeconds === 0) {
                extraUI = `<div class="mb-6 flex items-center gap-3 bg-[#F4F5F0] p-3 rounded-xl border border-[#EAECE4]"><span class="font-bold text-stone-600">Exam Length:</span><input type="number" id="timer-input-mins" onchange="updateInputMins(this.value)" value="${timerState.inputMinutes}" min="1" max="300" class="w-20 p-2 text-center rounded-lg border border-[#D5D8C5] focus:outline-none focus:ring-2 focus:ring-[#8B4513]"/><span class="font-bold text-stone-600">mins</span></div>`;
            } else if (m === 'pomodoro') {
                extraUI = `<div class="mb-6 flex gap-2"><button onclick="setBreak(false)" class="px-4 py-1 rounded-full text-sm font-bold ${!timerState.isBreak ? 'bg-red-200 text-red-800' : 'bg-transparent text-stone-500'}">Work (25m)</button><button onclick="setBreak(true)" class="px-4 py-1 rounded-full text-sm font-bold ${timerState.isBreak ? 'bg-blue-200 text-blue-800' : 'bg-transparent text-stone-500'}">Break (5m)</button></div>`;
            }

            const sessions = state.studySessions.slice(0,5).map(s => `
                <div class="flex justify-between items-center p-4 border-b border-[#EAECE4] last:border-0">
                    <div><p class="font-bold text-stone-800">${getCourseCode(s.courseId) === 'Unknown Course' ? 'General Study' : getCourseCode(s.courseId)} <span class="text-xs font-normal text-stone-500 uppercase ml-2 px-2 py-0.5 bg-stone-100 rounded">${s.mode}</span></p><p class="text-xs text-stone-500">${new Date(s.timestamp).toLocaleString()}</p></div>
                    <div class="font-black text-[#556B2F] bg-[#F4F5F0] px-3 py-1 rounded-lg border border-[#D5D8C5] whitespace-nowrap">${s.duration < 60 ? '< 1 min' : `${Math.floor(s.duration / 60)} mins`}</div>
                </div>
            `).join('') || `<div class="p-8 text-center text-stone-500">No sessions logged yet. Ready, set, focus!</div>`;

            const canSave = ((m === 'stopwatch' && timerState.timeSeconds > 0 && !timerState.isActive) || (m !== 'stopwatch' && !timerState.isActive && timerState.timeSeconds !== (m === 'pomodoro' ? (timerState.isBreak? 5*60 : 25*60) : timerState.inputMinutes*60)));

            return `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold text-stone-800">Focus Timer</h1>
                    <div class="flex bg-[#EAECE4] p-1 rounded-xl w-full max-w-md mx-auto">
                        <button onclick="setTimerMode('stopwatch')" class="flex-1 py-2 font-bold rounded-lg transition-colors flex items-center justify-center gap-2 ${m === 'stopwatch' ? 'bg-white shadow-sm text-[#556B2F]' : 'text-stone-500 hover:text-stone-800'}"><i data-lucide="timer" class="w-4 h-4"></i> Stopwatch</button>
                        <button onclick="setTimerMode('pomodoro')" class="flex-1 py-2 font-bold rounded-lg transition-colors flex items-center justify-center gap-2 ${m === 'pomodoro' ? 'bg-white shadow-sm text-red-600' : 'text-stone-500 hover:text-stone-800'}"><i data-lucide="coffee" class="w-4 h-4"></i> Pomodoro</button>
                        <button onclick="setTimerMode('countdown')" class="flex-1 py-2 font-bold rounded-lg transition-colors flex items-center justify-center gap-2 ${m === 'countdown' ? 'bg-white shadow-sm text-[#8B4513]' : 'text-stone-500 hover:text-stone-800'}"><i data-lucide="hourglass" class="w-4 h-4"></i> Mock Exam</button>
                    </div>
                    <div class="p-8 rounded-[2rem] shadow-xl border-4 flex flex-col items-center relative overflow-hidden transition-colors duration-500 ${bgClass}">
                        ${extraUI}
                        <select onchange="updateCourseId(this.value)" ${timerState.isActive ? 'disabled' : ''} class="w-full max-w-md p-3 text-center border-b-2 border-[#D5D8C5] focus:border-[#556B2F] outline-none mb-8 text-lg bg-transparent font-bold text-stone-700 placeholder-stone-400"><option value="">Select Course (Optional)</option>${options}</select>
                        <div id="timer-display-time" class="text-7xl md:text-9xl font-black mb-10 tracking-tighter tabular-nums ${textClass}">00:00:00</div>
                        <div class="flex gap-4">
                            <button onclick="toggleTimer()" class="px-10 py-4 rounded-2xl font-black text-white shadow-lg transition-transform hover:scale-105 active:scale-95 uppercase tracking-widest ${btnClass}">${timerState.isActive ? 'Pause' : 'Start'}</button>
                            ${(!timerState.isActive && timerState.timeSeconds > 0) ? `<button onclick="resetTimer()" class="px-6 py-4 rounded-2xl font-bold bg-[#EAECE4] text-stone-700 shadow-sm hover:bg-[#D5D8C5] transition-colors">Reset</button>` : ''}
                            ${canSave ? `<button onclick="finishSession()" class="px-8 py-4 rounded-2xl font-bold bg-[#556B2F] text-white shadow-lg hover:bg-[#6b853b] transition-transform hover:scale-105 active:scale-95">Log Session</button>` : ''}
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-stone-800 mb-4">Recent Sessions</h2>
                        <div class="bg-white rounded-2xl shadow-sm border border-[#EAECE4] overflow-hidden">${sessions}</div>
                    </div>
                </div>`;
        }

        function renderHistory() {
            const combined = [
                ...state.tasks.filter(t=>t.completed).map(t=>({...t, source:'Task'})),
                ...state.teamTasks.filter(t=>t.completed).map(t=>({...t, source:'Team Check'}))
            ].sort((a,b) => (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt));

            const list = combined.map((item, idx) => `
                <div class="flex justify-between items-center p-4 ${idx !== combined.length-1 ? 'border-b border-[#EAECE4]' : ''}">
                    <div>
                        <div class="flex items-center gap-2 mb-1"><span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded ${item.source === 'Task' ? 'bg-[#556B2F]/10 text-[#556B2F]' : 'bg-[#8B4513]/10 text-[#8B4513]'}">${item.source}</span><span class="font-semibold text-stone-700 line-through">${item.title}</span></div>
                        <p class="text-xs font-medium text-stone-500">${getCourseCode(item.courseId)} • Completed: ${item.completedAt ? new Date(item.completedAt).toLocaleDateString() : 'Recently'}</p>
                    </div>
                    <i data-lucide="check-circle-2" class="h-5 w-5 text-green-500 opacity-50"></i>
                </div>
            `).join('') || `<div class="p-10 text-center text-stone-500"><p>No completed tasks yet. Get to work! 💪</p></div>`;

            return `
                <div class="space-y-6">
                    <div class="flex items-center gap-3"><i data-lucide="history" class="h-8 w-8 text-[#556B2F]"></i><h1 class="text-3xl font-bold text-stone-800">Progress History</h1></div>
                    <div class="bg-white rounded-2xl shadow-sm border border-[#EAECE4] overflow-hidden">${list}</div>
                </div>`;
        }

        // Start App
        init();

    </script>
</body>
</html>
